<!doctype html>
<html lang="zh-Hans" data-appearance="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>添加 · Luliy</title>
<style>
  :root[data-appearance="dark"]{color-scheme:dark;--bg:#111110;--paper:#191918;--raised:#222220;--ink:#f2ede4;--text:#e8e3d9;--muted:#a6a198;--line:#3b3935;--line-strong:#777168;--accent:#b89a6a;--danger:#f0a08a}
  :root[data-appearance="dark"][data-palette="forest"]{--bg:#111a17;--paper:#16211d;--raised:#1e2b26;--muted:#a3a99f;--line:#2c3b35;--line-strong:#5a6b63}
  :root[data-appearance="dark"][data-palette="espresso"]{--bg:#181411;--paper:#1f1a16;--raised:#29231e;--muted:#aaa194;--line:#3d352d;--line-strong:#706455}
  :root[data-appearance="dark"][data-palette="midnight"]{--bg:#111319;--paper:#171a21;--raised:#20242d;--muted:#a3a3a6;--line:#2e323d;--line-strong:#5c6170}
  :root[data-appearance="dark"][data-palette="oxblood"]{--bg:#190e10;--paper:#211315;--raised:#2b1a1d;--muted:#ad9f9c;--line:#42292d;--line-strong:#76565b}
  :root[data-appearance="light"],:root[data-appearance="cc"]{color-scheme:light;--bg:#faf9f5;--paper:#f0eee7;--raised:#e9e6dd;--ink:#141413;--text:#30302d;--muted:#66645e;--line:#d8d5cd;--line-strong:#918b80;--accent:#8b6840;--danger:#b03a2e}
  body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;line-height:1.6}
  body.in-directory{background:transparent}
  main{max-width:640px;margin:0 auto;padding:24px 18px 48px}
  body.in-directory main{padding:12px 0 24px}
  a{color:var(--accent)}
  .head{display:flex;align-items:baseline;justify-content:space-between;gap:16px}
  h1{font-size:24px;margin:0;color:var(--ink)}
  .head a{font-size:14px;white-space:nowrap}
  details.token{border-bottom:1px solid var(--line);padding:10px 0;margin-bottom:16px}
  details.token summary{cursor:pointer;font-size:14px;color:var(--muted);list-style:none}
  details.token summary::-webkit-details-marker{display:none}
  .token-body{margin-top:12px}
  label{display:block;font-size:13px;margin:12px 0 4px;color:var(--muted)}
  input[type=text],input[type=url],input[type=password],select{width:100%;box-sizing:border-box;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--text);font-size:15px}
  input[type=color]{width:100%;box-sizing:border-box;height:44px;padding:4px;border:1px solid var(--line);border-radius:8px;background:var(--bg);cursor:pointer}
  input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-color:var(--accent)}
  .tabs{display:flex;gap:8px;flex-wrap:wrap}
  .tabs button,.mode button{padding:8px 16px;border:1px solid var(--line);border-radius:999px;background:transparent;color:var(--text);font-size:14px;cursor:pointer}
  .tabs button.on,.mode button.on{background:var(--accent);color:var(--paper);border-color:var(--accent)}
  .mode{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 4px}
  .row{display:flex;gap:12px}
  .row>*{flex:1;min-width:0}
  .dropzone{border:1px dashed var(--line-strong);border-radius:10px;padding:18px 14px;text-align:center;cursor:pointer;color:var(--muted);font-size:14px}
  .dropzone.over{border-color:var(--accent);color:var(--text)}
  .dropzone input{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden}
  .dropzone strong{color:var(--text)}
  .hint{font-size:13px;color:var(--muted);margin:6px 0 0}
  .check{font-size:14px}
  .check input{width:auto}
  .side-col{margin-top:20px}
  .card{background:var(--raised);border:1px solid var(--line);border-radius:12px;padding:16px}
  .card img{width:100%;max-height:240px;object-fit:cover;border-radius:8px;display:block;margin-bottom:12px}
  .card .cover-block{height:80px;border-radius:8px;margin-bottom:12px;display:flex;align-items:center;justify-content:center;font-size:28px;color:var(--paper);background:var(--accent)}
  .card h3{margin:0 0 4px;font-size:17px;color:var(--ink)}
  .card p{margin:0;font-size:14px;color:var(--muted)}
  .card .badge{display:inline-block;font-size:12px;border:1px solid var(--line);border-radius:999px;padding:2px 8px;margin-top:8px;color:var(--muted)}
  button.primary{width:100%;padding:13px;border:0;border-radius:10px;background:var(--accent);color:var(--paper);font-size:16px;cursor:pointer;margin-top:16px}
  button.primary:disabled{opacity:.5}
  button.ghost{padding:9px 14px;border:1px solid var(--line);border-radius:8px;background:transparent;color:var(--text);cursor:pointer}
  #status{white-space:pre-wrap;font-size:14px;color:var(--accent);min-height:1.6em;margin-top:12px}
  .progress{display:none;height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:10px}
  .progress i{display:block;height:100%;width:0%;background:var(--accent)}
  #progressText{display:none;font-size:13px;color:var(--muted);margin:6px 0 0}
  #status.err{color:var(--danger)}
  #success{display:none;background:var(--raised);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px}
  #success .ok{color:var(--text)}
  .small{font-size:13px;color:var(--muted)}
  @media (min-width:600px){
    main{max-width:1200px;padding:24px 32px 32px}
    body.in-directory main{padding:8px 16px 24px}
    .layout{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(280px,1fr);gap:32px;align-items:start}
    .side-col{margin-top:0;position:sticky;top:24px}
    .card img{max-height:280px}
  }
  @media (prefers-reduced-motion:reduce){
    *{transition:none!important;animation:none!important}
  }
</style>
</head>
<body>
<main>
  <div class="head"><h1>添加</h1><a id="homeLink" href="/">回首页</a></div>

  <details class="token" id="tokenDetails">
    <summary><span id="tokenSummary">钥匙</span> · <span id="tokenStateLine"></span></summary>
    <div class="token-body">
      <p class="small">GitHub 设置 &gt; Developer settings &gt; Personal access tokens &gt; Fine-grained tokens，只给 home 仓库 Contents 读写。</p>
      <label for="token">GitHub 钥匙</label>
      <input type="password" id="token" autocomplete="off" placeholder="粘贴钥匙">
      <div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap">
        <button type="button" class="ghost" id="saveToken">保存</button>
        <button type="button" class="ghost" id="clearToken">清除</button>
        <button type="button" class="ghost" id="testToken">测试</button>
      </div>
      <p class="small" id="tokenMsg"></p>
    </div>
  </details>

  <div id="success">
    <p class="ok"><strong>已提交。</strong></p>
    <p><a id="goLink" href="/">去看看</a> · <button type="button" class="ghost" id="again">再加一个</button></p>
  </div>

  <div class="layout">
    <div class="form-col">
      <div class="tabs" role="tablist">
        <button type="button" data-type="song" class="on">歌曲</button>
        <button type="button" data-type="work">作品</button>
        <button type="button" data-type="photo">照片</button>
      </div>

      <div data-panel="song">
        <div class="mode">
          <button type="button" data-mode="upload" class="on">上传文件</button>
          <button type="button" data-mode="link">贴直链</button>
        </div>
        <div data-field="upload">
          <div class="dropzone" id="sDrop"><strong>拖入音频文件，或点此选择</strong><br><span id="sFileInfo">mp3 等，不超过 20MB</span><input type="file" id="sFile" accept="audio/*"></div>
        </div>
        <div data-field="link" hidden>
          <label for="sUrl">音频直链</label>
          <input type="url" id="sUrl" placeholder="https://…">
        </div>
        <label for="sZh">歌名（中文）</label>
        <input type="text" id="sZh">
        <div class="row">
          <div><label for="sEn">英文名</label><input type="text" id="sEn"></div>
          <div><label for="sJa">日文名</label><input type="text" id="sJa"></div>
        </div>
        <div class="row">
          <div><label for="sDur">时长（秒）</label><input type="text" id="sDur" inputmode="numeric"></div>
          <div><label for="sColor">主色</label><input type="color" id="sColor" value="#9a8f83"></div>
        </div>
        <label for="sCover">封面网址</label>
        <input type="url" id="sCover" placeholder="https://…">
        <label class="check"><input type="checkbox" id="sDraft"> 存为草稿</label>
      </div>

      <div data-panel="work" hidden>
        <div class="mode">
          <button type="button" data-mode="upload" class="on">上传 HTML 文件</button>
          <button type="button" data-mode="link">贴外部链接</button>
        </div>
        <div data-field="upload">
          <div class="dropzone" id="wDrop"><strong>拖入 HTML 文件，或点此选择</strong><br><span id="wFileInfo">单个 HTML 文件</span><input type="file" id="wFile" accept=".html,text/html"></div>
        </div>
        <div data-field="link" hidden>
          <label for="wUrl">作品链接</label>
          <input type="url" id="wUrl" placeholder="https://…">
        </div>
        <label for="wName">作品名</label>
        <input type="text" id="wName">
        <label for="wZh">中文简介</label>
        <input type="text" id="wZh">
        <div class="row">
          <div><label for="wEn">英文简介</label><input type="text" id="wEn"></div>
          <div><label for="wJa">日文简介</label><input type="text" id="wJa"></div>
        </div>
        <label for="wExam">分类</label>
        <select id="wExam"><option value="false">網頁</option><option value="true">真題區</option></select>
        <label for="wCover">封面网址</label>
        <input type="url" id="wCover" placeholder="https://…">
        <label class="check"><input type="checkbox" id="wDraft"> 存为草稿</label>
      </div>

      <div data-panel="photo" hidden>
        <div class="mode">
          <button type="button" data-mode="upload" class="on">上传图片</button>
          <button type="button" data-mode="link">贴直链</button>
          <button type="button" data-mode="drive">Drive 文件名</button>
        </div>
        <div data-field="upload">
          <div class="dropzone" id="pDrop"><strong>拖入图片，或点此选择</strong><br><span id="pFileInfo">jpg、png、webp 等，不超过 20MB</span><input type="file" id="pFile" accept="image/*"></div>
        </div>
        <div data-field="link" hidden>
          <label for="pUrl">图片直链</label>
          <input type="url" id="pUrl" placeholder="https://…">
        </div>
        <div data-field="drive" hidden>
          <label for="pDrive">Drive 文件名</label>
          <input type="text" id="pDrive" placeholder="文件须已在 shared/照片墙/ 里">
        </div>
        <label for="pTitle">标题</label>
        <input type="text" id="pTitle">
        <label class="check"><input type="checkbox" id="pDraft"> 存为草稿</label>
      </div>
    </div>

    <div class="side-col">
      <div class="card" id="preview"><div id="previewBody"></div></div>
      <button type="button" class="primary" id="publish">发布</button>
      <div id="status"></div>
      <div class="progress" id="progressBar"><i id="progressFill"></i></div>
      <p class="small" id="progressText"></p>
    </div>
  </div>
</main>
<script>
(function(){
'use strict';
var $=function(id){return document.getElementById(id)};
var TOKEN_KEY='luliy-add-token';
var API='https://api.github.com/repos/luliyer6-ux/home/contents/';
var MAX_BYTES=20*1024*1024;
var type='song', mode='upload';
var params=new URLSearchParams(location.search);
if(params.get('type')==='work'||params.get('type')==='photo'||params.get('type')==='song') type=params.get('type');
if(params.get('exam')==='1') $('wExam').value='true';
var dropped={song:null,work:null,photo:null};

function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function setStatus(msg,err){var el=$('status');el.textContent=msg;el.className=err?'err':''}
function token(){return localStorage.getItem(TOKEN_KEY)||''}
function applyTheme(appearance,palette){
  if(!appearance||['dark','light','cc'].indexOf(appearance)<0) return;
  document.documentElement.dataset.appearance=appearance;
  if(palette) document.documentElement.dataset.palette=palette;
  else document.documentElement.removeAttribute('data-palette');
}
(function initTheme(){
  try{
    if(window.self!==window.top){
      var p=window.parent.document.documentElement;
      applyTheme(p.dataset.appearance,p.dataset.palette);
      return;
    }
  }catch(e){}
  try{applyTheme(localStorage.getItem('luliy-appearance'),localStorage.getItem('luliy-palette'));}catch(e){}
})();
window.addEventListener('message',function(e){
  if(e.data==='luliy-add-close') return;
  if(e.data&&e.data.type==='luliy-theme') applyTheme(e.data.appearance,e.data.palette);
});
function syncTokenState(){
  var has=!!token();
  $('tokenStateLine').textContent=has?'已保存':'未设置';
  $('tokenSummary').textContent='钥匙';
  $('tokenDetails').removeAttribute('open');
  if(has) $('token').value='';
}
function switchType(t){
  type=t;
  document.querySelectorAll('[data-type]').forEach(function(b){b.classList.toggle('on',b.dataset.type===t)});
  document.querySelectorAll('[data-panel]').forEach(function(p){p.hidden=p.dataset.panel!==t});
  var panel=document.querySelector('[data-panel="'+t+'"]');
  var on=panel.querySelector('.mode button.on');
  mode=on?on.dataset.mode:'upload';
  renderPreview();
}
function switchMode(m){
  mode=m;
  var p=document.querySelector('[data-panel="'+type+'"]');
  p.querySelectorAll('.mode button').forEach(function(b){b.classList.toggle('on',b.dataset.mode===m)});
  p.querySelectorAll('[data-field]').forEach(function(f){f.hidden=f.dataset.field!==m});
  renderPreview();
}
document.querySelectorAll('[data-type]').forEach(function(b){b.addEventListener('click',function(){switchType(b.dataset.type)})});
document.querySelectorAll('[data-panel] .mode button').forEach(function(b){b.addEventListener('click',function(){switchMode(b.dataset.mode)})});
$('saveToken').addEventListener('click',function(){
  var v=$('token').value.trim();
  if(!v){$('tokenMsg').textContent='请先粘贴钥匙。';return}
  localStorage.setItem(TOKEN_KEY,v);$('token').value='';$('tokenMsg').textContent='已保存。';syncTokenState();
});
$('clearToken').addEventListener('click',function(){localStorage.removeItem(TOKEN_KEY);$('tokenMsg').textContent='已清除。';syncTokenState();});
$('testToken').addEventListener('click',async function(){
  if(!token()){$('tokenMsg').textContent='尚未保存钥匙。';return}
  $('tokenMsg').textContent='正在测试…';
  try{await ghGet('data/songs.json');$('tokenMsg').textContent='钥匙可用。';}
  catch(e){$('tokenMsg').textContent='失败：'+e.message;}
});
$('again').addEventListener('click',function(){$('success').style.display='none';});

function stem(name){return name.replace(/\.[^.]+$/,'')}
function slugify(s){
  var s2=String(s).toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'');
  return s2||'track';
}
function getFile(t){
  var d=dropped[t];
  if(d) return d;
  var input=t==='song'?$('sFile'):t==='work'?$('wFile'): $('pFile');
  return input.files&&input.files[0];
}
function onFile(t,f,infoId){
  dropped[t]=f;
  $(infoId).textContent=f.name+' · '+(f.size/1048576).toFixed(2)+' MB';
  if(t==='song'){
    if(!$('sZh').value) $('sZh').value=stem(f.name);
    var a=new Audio();a.preload='metadata';
    a.onloadedmetadata=function(){if(!$('sDur').value) $('sDur').value=String(Math.round(a.duration));URL.revokeObjectURL(a.src);renderPreview()};
    a.src=URL.createObjectURL(f);
  } else if(t==='work'){
    if(!$('wName').value) $('wName').value=stem(f.name);
    if(!$('wZh').value) $('wZh').value=stem(f.name);
  } else {
    if(!$('pTitle').value) $('pTitle').value=stem(f.name);
    var r=new FileReader();
    r.onload=function(){renderPreview(r.result)};
    r.readAsDataURL(f);
    return;
  }
  renderPreview();
}
function bindDrop(dropId,inputId,t,infoId){
  var drop=$(dropId),input=$(inputId);
  drop.addEventListener('click',function(e){if(e.target!==input) input.click()});
  input.addEventListener('change',function(){if(input.files[0]) onFile(t,input.files[0],infoId)});
  ['dragenter','dragover'].forEach(function(ev){drop.addEventListener(ev,function(e){e.preventDefault();drop.classList.add('over')})});
  ['dragleave','drop'].forEach(function(ev){drop.addEventListener(ev,function(e){e.preventDefault();drop.classList.remove('over')})});
  drop.addEventListener('drop',function(e){
    var f=e.dataTransfer&&e.dataTransfer.files&&e.dataTransfer.files[0];
    if(f) onFile(t,f,infoId);
  });
}
bindDrop('sDrop','sFile','song','sFileInfo');
bindDrop('wDrop','wFile','work','wFileInfo');
bindDrop('pDrop','pFile','photo','pFileInfo');
document.querySelectorAll('input,select').forEach(function(el){el.addEventListener('input',function(){renderPreview()})});

function currentEntry(){
  if(type==='song'){
    var zh=$('sZh').value.trim(),f=getFile('song');
    return {zh:zh,en:$('sEn').value.trim()||zh,ja:$('sJa').value.trim()||zh,
      src:mode==='link'?$('sUrl').value.trim():(f?'./music/'+f.name:''),
      duration:$('sDur').value.trim(),color:$('sColor').value,cover:$('sCover').value.trim(),draft:$('sDraft').checked};
  }
  if(type==='work'){
    var wzh=$('wZh').value.trim(),f=getFile('work');
    return {name:$('wName').value.trim(),zh:wzh,en:$('wEn').value.trim()||wzh,ja:$('wJa').value.trim()||wzh,
      url:mode==='link'?$('wUrl').value.trim():(f?'./works/'+f.name:''),
      exam:$('wExam').value==='true',cover:$('wCover').value.trim(),draft:$('wDraft').checked};
  }
  var title=$('pTitle').value.trim(),f=getFile('photo');
  var e={title:title,credit:'',draft:$('pDraft').checked};
  if(mode==='link') e.src=$('pUrl').value.trim();
  else if(mode==='drive') e.drive=$('pDrive').value.trim();
  else e.src=f?'./photos/'+f.name:'';
  return e;
}
function renderPreview(imgData){
  var e=currentEntry(),html='';
  if(type==='song'){
    var initial=(e.zh||'').charAt(0);
    html=(e.cover?'<img src="'+esc(e.cover)+'" alt="" onerror="this.style.display=\'none\'">':(initial?'<div class="cover-block" style="background:'+esc(e.color)+'">'+esc(initial)+'</div>':'<p class="small">填写后这里会实时预览。</p>'))
      +'<h3>'+esc(e.zh||'未填歌名')+'</h3><p>'+esc(e.src||'未选文件或未填直链')+'</p>'
      +'<span class="badge">'+(e.duration?esc(e.duration)+' 秒':'时长未填')+'</span>'
      +(e.draft?' <span class="badge">草稿</span>':'');
  } else if(type==='work'){
    html=(e.cover?'<img src="'+esc(e.cover)+'" alt="" onerror="this.style.display=\'none\'">':'')
      +'<h3>'+esc(e.name||'未填作品名')+'</h3><p>'+esc(e.zh||'未填简介')+'</p>'
      +'<span class="badge">'+(e.exam?'真題區':'網頁')+'</span>'
      +(e.url?'<p>'+esc(e.url)+'</p>':'')
      +(e.draft?' <span class="badge">草稿</span>':'');
  } else {
    if(imgData) html+='<img src="'+imgData+'" alt="">';
    else if(e.src&&e.src.indexOf('http')===0) html+='<img src="'+esc(e.src)+'" alt="" onerror="this.style.display=\'none\'">';
    else if(e.drive) html+='<p>Drive：'+esc(e.drive)+'</p>';
    html+='<h3>'+esc(e.title||'未填标题')+'</h3><p>'+esc(e.src||e.drive||'未选文件或未填地址')+'</p>'
      +(e.draft?' <span class="badge">草稿</span>':'');
  }
  $('previewBody').innerHTML=html;
}

async function gh(path,method,body){
  var r=await fetch(API+path,{method:method||'GET',headers:{'Accept':'application/vnd.github+json','Authorization':'Bearer '+token()},body:body?JSON.stringify(body):undefined});
  if(r.status===404) return null;
  var d=await r.json().catch(function(){return {}});
  if(!r.ok){
    if(r.status===401) throw new Error('钥匙无效或已过期，请重新粘贴保存。');
    if(r.status===403) throw new Error('GitHub 拒绝了这次请求（可能是钥匙权限不足或触发频率限制）。');
    if(r.status===409) throw new Error('清单文件同时被改过，冲突。');
    throw new Error((d&&d.message)||('GitHub 返回 '+r.status));
  }
  return d;
}
async function ghGet(path){return gh(path,'GET')}
// File upload must use XHR, not fetch: fetch cannot report upload progress,
// which is why the old page stayed on "正在上传文件…" with no movement.
function ghUpload(path,body,onProgress){
  return new Promise(function(res,rej){
    var xhr=new XMLHttpRequest();
    xhr.open('PUT',API+path);
    xhr.setRequestHeader('Accept','application/vnd.github+json');
    xhr.setRequestHeader('Authorization','Bearer '+token());
    xhr.setRequestHeader('Content-Type','application/json');
    xhr.upload.onprogress=function(e){
      if(e.lengthComputable&&onProgress) onProgress(e.loaded,e.total);
    };
    xhr.onload=function(){
      var d={}; try{d=JSON.parse(xhr.responseText||'{}')}catch(e){}
      if(xhr.status===404) return res(null);
      if(xhr.status>=200&&xhr.status<300) return res(d);
      if(xhr.status===401) return rej(new Error('钥匙无效或已过期，请重新粘贴保存。'));
      if(xhr.status===403) return rej(new Error('GitHub 拒绝了这次请求（可能是钥匙权限不足或触发频率限制）。'));
      rej(new Error((d&&d.message)||('GitHub 返回 '+xhr.status)));
    };
    xhr.onerror=function(){rej(new Error('上传失败：网络中断，请检查网络后重试。'))};
    xhr.send(JSON.stringify(body));
  });
}
function showProgress(loaded,total){
  var bar=$('progressBar'),fill=$('progressFill'),txt=$('progressText');
  if(!bar) return;
  var pct=total>0?Math.min(100,Math.round(loaded/total*100)):0;
  bar.style.display='block'; txt.style.display='block';
  fill.style.width=pct+'%';
  txt.textContent=total>1?'正在上传文件… '+pct+'%（'+(loaded/1048576).toFixed(2)+' / '+(total/1048576).toFixed(2)+' MB）':'正在上传文件… 0%';
}
function hideProgress(){
  var bar=$('progressBar'),txt=$('progressText');
  if(bar) bar.style.display='none';
  if(txt) txt.style.display='none';
  var fill=$('progressFill'); if(fill) fill.style.width='0%';
}
function b64FromFile(file){
  return new Promise(function(res,rej){
    var r=new FileReader();
    r.onload=function(){
      var bytes=new Uint8Array(r.result),bin='',chunk=0x8000;
      for(var i=0;i<bytes.length;i+=chunk) bin+=String.fromCharCode.apply(null,bytes.subarray(i,i+chunk));
      res(btoa(bin));
    };
    r.onerror=function(){rej(new Error('读取文件失败。'))};
    r.readAsArrayBuffer(file);
  });
}
function b64Text(s){
  var bytes=new TextEncoder().encode(s),bin='',chunk=0x8000;
  for(var i=0;i<bytes.length;i+=chunk) bin+=String.fromCharCode.apply(null,bytes.subarray(i,i+chunk));
  return btoa(bin);
}
function decodeB64(b64){
  var bin=atob(b64.replace(/\n/g,'')),bytes=new Uint8Array(bin.length);
  for(var i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
  return new TextDecoder().decode(bytes);
}

$('publish').addEventListener('click',async function(){
  var btn=$('publish');
  try{
    if(!token()){$('tokenDetails').setAttribute('open','');setStatus('尚未保存钥匙：先在钥匙区粘贴并保存。',true);return}
    var e=currentEntry(),file=null,targetPath='',dataPath='',goHref='/',goText='去看看';
    if(type==='song'){
      if(!e.zh) throw new Error('请填写歌名（中文）。');
      if(mode==='upload'){
        file=getFile('song');if(!file) throw new Error('请先选择音频文件。');
        if(file.size>MAX_BYTES) throw new Error('文件超过 20MB，请改走直链。');
        targetPath='music/'+file.name;
      } else {
        if(!e.src||e.src.indexOf('http')!==0) throw new Error('请填写以 http 开头的音频直链。');
      }
      dataPath='data/songs.json';goHref='/#/records';goText='去唱片页看看';
    } else if(type==='work'){
      if(!e.name) throw new Error('请填写作品名。');
      if(!e.zh) throw new Error('请填写中文简介。');
      if(mode==='upload'){
        file=getFile('work');if(!file) throw new Error('请先选择 HTML 文件。');
        if(!/\.html?$/i.test(file.name)) throw new Error('作品文件须为 HTML 文件。');
        if(file.size>MAX_BYTES) throw new Error('文件超过 20MB，请改走外部链接。');
        targetPath='works/'+file.name;
      } else {
        if(!e.url||e.url.indexOf('http')!==0) throw new Error('请填写以 http 开头的作品链接。');
      }
      dataPath='data/works.json';goHref='/#/projects';goText='去作品页看看';
    } else {
      if(!e.title) throw new Error('请填写照片标题。');
      if(mode==='upload'){
        file=getFile('photo');if(!file) throw new Error('请先选择图片文件。');
        if(file.size>MAX_BYTES) throw new Error('文件超过 20MB，请改走直链。');
        targetPath='photos/'+file.name;
      } else if(mode==='link'){
        if(!e.src||e.src.indexOf('http')!==0) throw new Error('请填写以 http 开头的图片直链。');
      } else {
        if(!e.drive) throw new Error('请填写 Drive 文件名。');
      }
      dataPath='data/photos.json';goHref='/#/projects';goText='去作品页的照片牆看看';
    }
    btn.disabled=true;
    if(file){
      setStatus('正在上传文件…');
      var exists=await ghGet(targetPath);
      if(exists) throw new Error('仓库里已有同名文件：'+targetPath+'，请改名后再发布，或先删旧文件。');
      var fileB64=await b64FromFile(file);
      setStatus('正在上传文件…');
      showProgress(0,1);
      await ghUpload(targetPath,{message:'Add '+targetPath+' via add page',content:fileB64,branch:'main'},showProgress);
      hideProgress();
    }
    setStatus('正在写入清单…');
    for(var attempt=0;attempt<2;attempt++){
      var cur=await ghGet(dataPath);
      if(!cur) throw new Error('读不到清单文件 '+dataPath+'，请稍后再试。');
      var data=JSON.parse(decodeB64(cur.content));
      if(type==='song'){
        var ids=data.map(function(s){return s.id});
        var id=slugify(e.zh),n=2;
        while(ids.indexOf(id)>=0){id=slugify(e.zh)+'-'+n;n++}
        if(data.some(function(s){return s.src===e.src})) throw new Error('清单里已有相同地址的歌曲。');
        var dur=parseFloat(e.duration);
        data.push({id:id,name:{zh:e.zh,en:e.en,ja:e.ja},src:e.src,duration:isNaN(dur)?null:dur,color:e.color,cover:e.cover,draft:!!e.draft});
      } else if(type==='work'){
        if(data.works.some(function(w){return w.url===e.url})) throw new Error('清单里已有相同地址的作品。');
        if(data.works.some(function(w){return w.name===e.name})) throw new Error('清单里已有同名作品，请换一个作品名。');
        data.works.push({name:e.name,zh:e.zh,en:e.en,ja:e.ja,url:e.url,cover:e.cover,exam:e.exam,draft:!!e.draft});
      } else {
        var key=e.src||e.drive;
        if(data.some(function(p){return (p.src||p.drive)===key})) throw new Error('清单里已有相同地址的照片。');
        var ph={title:e.title,credit:'',draft:!!e.draft};
        if(e.src) ph.src=e.src; else ph.drive=e.drive;
        data.push(ph);
      }
      try{
        await gh(dataPath,'PUT',{message:'Add entry via add page',content:b64Text(JSON.stringify(data,null,2)+'\n'),sha:cur.sha,branch:'main'});
        break;
      }catch(err){
        if(attempt===0&&/冲突/.test(err.message)) continue;
        throw err;
      }
    }
    $('goLink').href=goHref;$('goLink').textContent=goText;
    $('success').style.display='block';
    setStatus('发布成功。');
  }catch(err){
    setStatus('发布失败：'+err.message,true);
  }finally{
    hideProgress();
    btn.disabled=false;
  }
});
