:root{--green:#184b3a;--border:#dce4de;--ink:#26372f;--muted:#69776e}*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;background:#fff;color:var(--ink);font:17px/1.9 "Segoe UI","Microsoft YaHei",sans-serif}button,select,input,textarea{font:inherit}button,select{cursor:pointer}button{border:1px solid var(--border);border-radius:8px;background:#fff;color:var(--green);padding:7px 12px;line-height:1.4}button:hover:enabled{background:#f0f5f1}button:disabled{cursor:default;opacity:.58}button:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid #76a590;outline-offset:2px}.primary{background:var(--green);color:white;border-color:var(--green)}.primary:hover:enabled{background:#23654e}header{border-bottom:1px solid var(--border);background:#fff;position:sticky;top:0;z-index:10}header .bar{max-width:1120px;margin:auto;padding:12px 20px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}.brand{font-weight:700;color:var(--green);margin-right:auto;font-size:20px}.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}select,input{border:1px solid var(--border);border-radius:7px;background:#fff;padding:6px 9px;color:var(--ink);font-size:15px}#duration{width:78px}#durationWrap{font-size:14px}.timer{font-size:14px;color:var(--green);font-variant-numeric:tabular-nums;white-space:nowrap}main{max-width:860px;margin:30px auto 90px;padding:0 22px}h1{font-size:26px;line-height:1.4;color:var(--green);margin:0 0 6px}.sub,.hint,.source-name,figcaption{color:var(--muted);font-size:13px;line-height:1.7}.sub{margin:0 0 18px}.progressbar{height:4px;background:#eef2ee;border-radius:4px;margin:8px 0 18px}.progressbar span{height:100%;display:block;background:#558d72;border-radius:4px;transition:width .2s}.grid-head{display:flex;gap:12px;align-items:center;margin-bottom:10px}.grid-head span{margin-right:auto;font-size:14px}.qgrid{display:grid;grid-template-columns:repeat(12,1fr);gap:6px;margin-bottom:28px}.qnum{padding:7px 0;font-size:14px;border-radius:6px}.qnum.answered{background:#e9f0eb}.qnum.correct{background:#e8f4eb;color:#247448;border-color:#c7dfcb}.qnum.wrong,.qnum.blank-after{background:#fff0ee;color:#a44d46;border-color:#ebcecb}.qnum.current{outline:2px solid var(--green);outline-offset:1px;font-weight:700}.question-title{font-size:21px;font-weight:700;color:var(--green);border-bottom:1px solid var(--border);padding-bottom:13px;margin-bottom:18px}.badge{font-size:12px;font-weight:400;display:inline-block;vertical-align:middle;padding:2px 8px;border-radius:5px;background:#f0f4f0;color:var(--muted);margin-left:10px}.stem p{margin:6px 0;white-space:pre-wrap;overflow-wrap:anywhere}.options{display:grid;gap:10px;margin:20px 0}.option{display:flex;text-align:left;gap:14px;align-items:baseline;width:100%;padding:13px 16px;color:var(--ink);font-size:16px;line-height:1.8}.option-letter{font-weight:700;color:var(--green);width:18px;flex-shrink:0}.option.chosen{border-color:#477b61;background:#eff5f1}.option.correct{background:#edf7ee;border-color:#8dba95}.option.incorrect{background:#fff1ee;border-color:#daaaa4}.option:disabled{opacity:1}.feedback{padding:11px 15px;border-radius:7px;margin:18px 0;font-size:15px}.ok{color:#28723e;background:#eef7ee}.bad{color:#a24239;background:#fff0ed}.notice{font-size:14px;background:#f4f5f1;padding:10px 13px;border-radius:6px}.original,.analysis{margin:20px 0;border:1px solid var(--border);border-radius:9px;overflow:hidden}summary{cursor:pointer;padding:12px 15px;list-style-position:inside;color:var(--green);font-size:15px;font-weight:600;background:#f7f9f6}details[open]>summary{border-bottom:1px solid var(--border)}.source-fragment{margin:12px 8px}.source-fragment svg{display:block;width:100%;height:auto;background:#fff}figcaption{margin:4px 8px}.source-name{padding:0 16px;overflow-wrap:anywhere}textarea{display:block;resize:vertical;width:100%;border:1px solid var(--border);border-radius:8px;padding:12px;line-height:1.7;font-size:15px;background:#fff}.response-label{font-size:14px;color:var(--muted);display:block;margin-top:20px}.navigation{display:flex;justify-content:space-between;gap:15px;border-top:1px solid var(--border);padding:20px 0;margin-top:25px}#status{font-size:13px;color:var(--muted);margin:18px 0}#result{border:1px solid #bfd2c2;background:#f5f9f3;border-radius:10px;margin-bottom:24px;padding:20px}#result strong{font-size:27px;color:var(--green)}#result p{margin:4px 0;font-size:14px}.drawer{position:fixed;right:0;top:0;height:100dvh;width:min(480px,100%);z-index:30;background:white;box-shadow:-8px 0 28px #16382722;display:flex;flex-direction:column;border-left:1px solid var(--border)}.drawer-head{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--border)}.drawer-head h2{margin:0;font-size:20px;color:var(--green)}#historyList{overflow:auto;padding:18px;flex:1}.history-record{border:1px solid var(--border);border-radius:8px;margin-bottom:14px}.history-record>summary{display:flex;justify-content:space-between;gap:10px;font-size:14px}.history-record p{padding:0 12px;font-size:13px}.history-answers{padding:12px;display:grid;grid-template-columns:repeat(5,1fr);gap:5px}.history-answers span{padding:3px;text-align:center;border-radius:4px;font-size:12px}.history-answers small{display:block;font-size:10px}.history-record details{margin:10px}.history-record pre{white-space:pre-wrap;overflow-wrap:anywhere;padding:12px;font:13px/1.7 monospace}.empty{font-size:14px;color:var(--muted)}.floating{position:fixed;right:22px;bottom:22px;border-radius:50%;width:46px;height:46px;box-shadow:0 3px 12px #233b2720;font-size:21px;background:#fff;z-index:11}.hint:empty{display:none}@media(max-width:700px){body{font-size:16px;line-height:1.85}header .bar{padding:10px 14px;gap:7px}.brand{width:100%;font-size:18px}.controls{gap:6px}button{font-size:13px;padding:7px 9px}main{margin-top:22px;padding:0 15px}.qgrid{grid-template-columns:repeat(8,1fr);gap:5px}.option{font-size:15px;padding:11px 12px}.question-title{font-size:19px}.badge{margin-left:4px}.source-fragment{margin:10px 2px}h1{font-size:23px}.floating{bottom:16px;right:16px}}@media print{header,.qgrid,.grid-head,.navigation,.floating,.drawer,#status{display:none!important}main{max-width:none;margin:0;padding:0}.original:not([open]),.analysis:not([open]){display:none}.source-fragment{break-inside:avoid}.option{border-color:#aaa}details>summary{background:white}body{font-size:12pt}}
