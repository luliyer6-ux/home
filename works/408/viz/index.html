<head>

<!-- Tailwind 本地兜底（MIT，随仓库部署，离线可用） -->
<script src="https://cdn.tailwindcss.com/3.4.16"></script>
<script>if(window.tailwind){tailwind.config={theme:{extend:{fontFamily:{sans:['"Segoe UI"','"Microsoft YaHei"','system-ui','sans-serif'],mono:['Consolas','ui-monospace','monospace']}}}}};</script>
<!-- KaTeX（CDN；失败时框架自带降级排版） -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
<link rel="stylesheet" href="css/style.css">
<style>
.viz-topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  padding:10px 16px;background:#fff;border-bottom:1px solid #dce4de}
.viz-topbar h1{font-size:17px;color:#184b3a;margin:0}
.viz-topbar .ctx{font-size:12px;color:#69776e}
a.viz-back{display:inline-block;border:1px solid #dce4de;border-radius:8px;padding:6px 14px;
  color:#184b3a;text-decoration:none;font-size:14px;background:#fff}
a.viz-back:hover{background:#f0f5f1}
.viz-license{font-size:11px;color:#9aa5a0}
main{max-width:1100px;margin:0 auto;padding:16px 16px 64px}
#topic-header{margin:6px 0 14px}
.card{background:#fff;border:1px solid #e2e8f0;border-radius:12px;margin-bottom:16px;overflow:hidden}
</style>
</head>
<body class="bg-slate-100 text-slate-800">
<header class="viz-topbar">
  <a class="viz-back" id="backLink" target="_top" href="../index.html">&larr; 返回原题</a>
  <div style="flex:1;min-width:200px">
    <h1 id="vizTitle">考点演示</h1>
    <div class="ctx" id="vizCtx"></div>
  </div>
  <span class="viz-license">可视化模块来源：ASD-0613/408-Review-Visualization-Platform（MIT）</span>
</header>
<main>
  <div id="topic-header"></div>
  <div class="card" id="theory-card">
    <div class="flex items-center justify-between px-5 py-3 cursor-pointer select-none" id="theory-toggle">
      <div class="flex items-center gap-2 font-bold text-slate-700"><span>&#x1F4D6;</span><span>理论知识</span></div>
      <span id="theory-arrow" class="text-slate-400 text-sm">&#x25BC;</span>
    </div>
    <div id="theory-body" class="px-5 pb-5"></div>
  </div>
  <div class="card p-5" id="viz-card" style="padding:20px">
    <div class="flex items-center gap-2 font-bold text-slate-700" style="margin-bottom:12px">
      <span>&#x1F9EA;</span><span>交互式可视化</span>
      <div class="ml-auto flex items-center gap-1 rounded-lg bg-slate-100 p-1">
        <button id="zoom-out" title="缩小">&#xFF0D;</button>
        <button id="zoom-reset" title="恢复 100%">100%</button>
        <button id="zoom-in" title="放大">&#xFF0B;</button>
      </div>
    </div>
    <div id="input-area"></div>
    <div id="control-area"></div>
    <div id="step-desc" class="hidden"></div>
    <div id="stage"></div>
  </div>
  <div class="card" id="log-card">
    <div class="flex items-center justify-between px-5 py-2.5 bg-slate-50 border-b border-slate-100">
      <div class="flex items-center gap-2 font-bold text-slate-700 text-sm"><span>&#x1F4CB;</span><span>执行日志</span></div>
      <button id="log-clear" class="text-xs text-slate-400">清空</button>
    </div>
    <div id="log-box" class="log-box h-44 overflow-y-auto px-4 py-3 font-mono text-xs leading-6"></div>
  </div>
</main>
<!-- 专注模式控件：框架 mount() 需要这些 id 存在；本查看器不启用专注模式，故隐藏 -->

<button id="fp-exit" style="display:none" tabindex="-1"></button>
<select id="fp-topic" style="display:none" tabindex="-1"></select>

<script>
(function(){
  "use strict";
  var $ = function(id){ return document.getElementById(id); };
  var params = new URLSearchParams(location.search);
  var moduleId = params.get('module') || '';
  var year = params.get('year'), q = params.get('q');
  var META = window.VIZ_MODULES || {};
  function fail(msg){
    $('vizTitle').textContent = '考点演示不可用';
    $('stage').innerHTML = '<div style="padding:40px;text-align:center;color:#94a3b8">' + msg + '</div>';
  }
  /* 白名单校验：只允许 64 个已知模块 id，防路径注入 */
  if (!Object.prototype.hasOwnProperty.call(META, moduleId)) {
    fail('未找到该考点演示模块（module 参数无效）。');
    return;
  }
  var meta = META[moduleId];
  /* 书籍元数据：供框架 findTopicMeta() 查中文 label 与书签徽标 */
  var BOOKDEF = {
    '数据结构':      {id:'ds',  name:'数据结构',       icon:'\uD83E\uDDE9', accent:'#6366f1'},
    '计算机组成原理': {id:'coa', name:'计算机组成原理', icon:'\u2699\uFE0F', accent:'#0ea5e9'},
    '操作系统':      {id:'os',  name:'操作系统',       icon:'\uD83D\uDDA5\uFE0F', accent:'#10b981'},
    '计算机网络':    {id:'net', name:'计算机网络',     icon:'\uD83C\uDF10', accent:'#f59e0b'}
  };
  var books = [];
  Object.keys(BOOKDEF).forEach(function(subj){
    var b = BOOKDEF[subj];
    var topics = Object.keys(META).filter(function(id){ return META[id].subject === subj; })
      .map(function(id){ return {id:id, label:META[id].label, status:'ready'}; });
    books.push({id:b.id, name:b.name, icon:b.icon, accent:b.accent,
      chapters:[{id:'all', title:'全部', topics:topics}]});
  });
  if (typeof RC408 !== 'undefined') RC408.books = books;
  document.title = '考点演示 · ' + meta.label;
  $('vizTitle').textContent = meta.label;
  if (year && q) {
    $('vizCtx').textContent = year + ' 年第 ' + q + ' 题 · 关联演示';
    document.title += '（' + year + '年第' + q + '题）';
    $('backLink').href = '../index.html?year=' + encodeURIComponent(year) + '&q=' + encodeURIComponent(q);
  } else {
    $('vizCtx').textContent = meta.subject + ' · 交互式可视化';
  }
  var s = document.createElement('script');
  s.src = 'modules/' + encodeURIComponent(moduleId) + '/' + meta.file;
  s.onload = function(){
    try {
      Runner.mount();
      Runner.open(moduleId);
    } catch(e){ fail('演示初始化失败：' + e.message); }
  };
  s.onerror = function(){ fail('演示模块文件加载失败，请检查网络后重试。'); };
  document.head.appendChild(s);
})();
</script>
</body>
