}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--paper:#151514;--surface:#1f1f1d;--ink:#e5e1d6;--muted:#9a968c;--rule:#d5d0c5;--hair:#383834;--mark:#32312c;color-scheme:dark}}
:root[data-theme="dark"]{--paper:#151514;--surface:#1f1f1d;--ink:#e5e1d6;--muted:#9a968c;--rule:#d5d0c5;--hair:#383834;--mark:#32312c;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.7 var(--serif);-webkit-font-smoothing:antialiased}
::selection{background:var(--ink);color:var(--paper)}
a{color:inherit}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
/* paper grain + front light: under the content, never over it */
.grain,.warmth{position:fixed;inset:0;pointer-events:none;z-index:0}
.grain{opacity:.55;mix-blend-mode:multiply;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.14'/%3E%3C/svg%3E")}
.warmth{background:rgb(255 170 70 / calc(var(--warm) * .16));mix-blend-mode:multiply}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .grain{mix-blend-mode:screen;opacity:.18}}
:root[data-theme="dark"] .grain{mix-blend-mode:screen;opacity:.18}
main,header,footer{position:relative;z-index:1}
/* top bar */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border-bottom:1px solid var(--rule)}
.bar .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:44px;font:12px/1 var(--mono);letter-spacing:.06em}
.bar b{letter-spacing:.14em}
.bar nav{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.btn{font:12px/1 var(--mono);letter-spacing:.06em;color:var(--ink);background:none;border:1px solid var(--rule);border-radius:2px;padding:7px 10px;cursor:pointer;text-decoration:none;transition:background-color .1s steps(2),color .1s steps(2)}
.btn:hover,.btn[aria-pressed="true"],.btn:focus-visible{background:var(--ink);color:var(--paper);outline:none}
.light{position:relative}
.light-panel{position:absolute;right:0;top:calc(100% + 8px);width:240px;padding:14px;border:1px solid var(--rule);background:var(--paper);box-shadow:4px 4px 0 var(--hair)}
.light-panel label{display:flex;justify-content:space-between;font:11px/1 var(--mono);letter-spacing:.1em;margin-bottom:8px}
.light-panel input{width:100%;accent-color:var(--ink)}
/* masthead: the ink portrait is drawn in the page's ink, so it follows 白紙 / 夜間 */
.brand{display:inline-flex;align-items:center;gap:8px;text-decoration:none}
.mini-av{width:22px;height:24px;background:var(--ink);-webkit-mask:var(--av) center/contain no-repeat;mask:var(--av) center/contain no-repeat}
/* home: portrait on the left (stays put while the list scrolls), contents on the right */
.home{display:grid;grid-template-columns:minmax(200px,300px) minmax(0,1fr);gap:clamp(32px,6vw,80px);align-items:start;padding-block:clamp(28px,5vw,56px) 0}
.mast{position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px);display:grid;justify-items:center;gap:10px}
.avatar{width:100%;max-width:300px}
.av-ink{display:block;width:100%;aspect-ratio:459/520;background:var(--ink);-webkit-mask:var(--av) center/contain no-repeat;mask:var(--av) center/contain no-repeat}
/* 夜間: the original drawing, like a print on the page, instead of inverted lines */
.av-photo{display:none;width:100%;height:auto;border:1px solid var(--rule);box-shadow:6px 6px 0 var(--hair)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .av-ink{display:none}:root:not([data-theme="light"]) .av-photo{display:block}}
:root[data-theme="dark"] .av-ink{display:none}:root[data-theme="dark"] .av-photo{display:block}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .mini-av{-webkit-mask:none;mask:none;background:var(--avp) center/cover;border:1px solid var(--rule)}}
:root[data-theme="dark"] .mini-av{-webkit-mask:none;mask:none;background:var(--avp) center/cover;border:1px solid var(--rule)}
.mast p{margin:0;font-style:italic;color:var(--muted);font-size:15px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (max-width:760px){.home{grid-template-columns:1fr;gap:20px}.mast{position:static}.avatar{max-width:200px}}
/* contents: the only list on the page */
.contents{min-width:0}
.c-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding-bottom:10px;border-bottom:3px double var(--rule)}
.c-head h2{margin:0;font:700 20px/1.2 var(--display);letter-spacing:.2em}
.c-head span{font:11.5px var(--mono);letter-spacing:.08em;color:var(--muted)}
.contents ol{list-style:none;margin:0;padding:0}
.contents li{border-bottom:1px solid var(--hair)}
.contents a{display:grid;grid-template-columns:4em minmax(0,1fr) auto;gap:4px 14px;align-items:baseline;padding:16px 6px;text-decoration:none;transition:background-color .1s steps(2),color .1s steps(2)}
.contents a:hover,.contents a:focus-visible{background:var(--ink);color:var(--paper);outline:none}
.contents a:hover :is(.no,em,.meta),.contents a:focus-visible :is(.no,em,.meta){color:inherit;opacity:.75}
.contents .no{font:11.5px var(--mono);color:var(--muted);font-variant-numeric:tabular-nums}
.contents .tt{min-width:0;display:grid;gap:4px}
.contents .tt b{font:700 19px/1.4 var(--serif);overflow-wrap:anywhere}
.contents .tt em{font-style:normal;font-size:14px;line-height:1.6;color:var(--muted);display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.contents .meta{display:grid;justify-items:end;gap:2px;font:11px/1.4 var(--mono);color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.c-side{display:flex;align-items:baseline;gap:14px}
.link-btn{font:11.5px var(--mono);letter-spacing:.08em;color:var(--ink);background:none;border:0;border-bottom:1px solid var(--ink);padding:0 0 1px;cursor:pointer}
.link-btn[aria-expanded="true"]{border-bottom-style:double;border-bottom-width:3px}
.find{padding:12px 0;border-bottom:1px solid var(--hair)}
.find input{width:100%;font:15px var(--serif);color:var(--ink);background:none;border:0;border-bottom:1px solid var(--rule);padding:6px 2px;outline:none}
.find input:focus{border-bottom-width:2px}
.yr{display:flex;justify-content:space-between;align-items:baseline;margin:26px 0 0;padding:0 6px 6px;border-bottom:1px solid var(--rule);font:600 13px/1 var(--mono);letter-spacing:.24em}
.yr small{font-weight:400;letter-spacing:.08em;color:var(--muted)}
.yr:first-child{margin-top:14px}
.pbar{display:block;height:2px;margin-top:6px;background:var(--hair);max-width:220px}.pbar i{display:block;height:100%;background:var(--ink)}
.contents a:hover .pbar,.contents a:focus-visible .pbar{background:color-mix(in srgb,var(--paper) 40%,transparent)}.contents a:hover .pbar i,.contents a:focus-visible .pbar i{background:var(--paper)}
.none{padding:28px 6px;font:13px var(--mono);color:var(--muted)}
.cm{margin-top:40px;border-top:1px solid var(--rule);padding-top:14px}
.cm-row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.cm-btn{font:700 15px var(--serif);color:var(--ink);background:none;border:0;padding:4px 0;cursor:pointer}
.cm-btn span{font-size:11px;margin-left:6px}
.cm-row a{font:11.5px var(--mono);color:var(--muted)}
.cm-box{margin-top:12px}.cm-box .note2{font:12.5px/1.8 var(--mono);color:var(--muted)}
.page{min-height:60vh;display:grid;place-items:center;padding-block:60px}
.page-in{max-width:34em;text-align:center}
.page .lead{margin:0;font:400 clamp(22px,3.4vw,32px)/1.6 var(--serif);text-wrap:balance}
.page .sig{margin:18px 0 0;font:12px var(--mono);letter-spacing:.2em;color:var(--muted)}
.page .big{margin:0 0 10px;font:400 clamp(72px,14vw,140px)/1 var(--display);color:var(--hair)}
.page .back{margin:36px 0 0;font:12px var(--mono);letter-spacing:.1em}
.page .back a{text-underline-offset:4px}
.r-body .anc{margin-left:.4em;font:400 .8em var(--mono);color:var(--muted);text-decoration:none;opacity:0;cursor:pointer;background:none;border:0;padding:0}
.r-body :is(h1,h2,h3,h4):hover .anc,.r-body .anc:focus-visible{opacity:1}
.r-body .codebox{position:relative}
.r-body .codebox .cp{position:absolute;top:6px;right:6px;font:11px var(--mono);color:var(--muted);background:var(--paper);border:1px solid var(--hair);padding:3px 8px;cursor:pointer;opacity:0}
.r-body .codebox:hover .cp,.r-body .codebox .cp:focus-visible{opacity:1}
.r-body img{cursor:zoom-in}
.zoom{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:max(16px,env(safe-area-inset-top,0px)) 16px;background:color-mix(in srgb,var(--paper) 94%,transparent);cursor:zoom-out}
.zoom img{max-width:100%;max-height:100%;object-fit:contain;border:1px solid var(--rule);filter:grayscale(1) contrast(1.15)}
@media (hover:none){.r-body .anc,.r-body .codebox .cp{opacity:1}}
.colo{margin-top:48px;border-top:1px solid var(--rule)}
.colo .wrap{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px 20px;padding-block:18px 28px;font:11.5px/1.6 var(--mono);color:var(--muted)}
.colo a{text-decoration:none;color:var(--ink)}.colo a:hover{text-decoration:underline}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
@media (max-width:560px){.contents a{grid-template-columns:3em minmax(0,1fr)}.contents .meta{grid-column:2;justify-items:start;display:flex;gap:10px}}
/* ---------- reader ---------- */
.rbar{display:flex;align-items:center;gap:6px}
.prog{position:absolute;left:0;right:0;bottom:-1px;height:2px}.prog i{display:block;height:100%;width:0;background:var(--ink)}
.reader{padding-block:8px 60px}
.r-grid{display:grid;grid-template-columns:minmax(0,1fr) 230px;gap:48px;align-items:start}
.r-grid.no-toc{grid-template-columns:minmax(0,1fr)}
.r-main{min-width:0;max-width:var(--measure,68ch);margin-inline:auto;width:100%}
.r-crumb{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;padding-block:12px;border-bottom:1px solid var(--rule);font:11.5px/1.4 var(--mono);letter-spacing:.08em;color:var(--muted)}
.r-crumb a{text-decoration:none}.r-crumb a:hover{text-decoration:underline}
.r-head{padding-block:28px 0}
.r-head h1:focus{outline:none}
.r-head h1{margin:14px 0 18px;font:700 clamp(32px,5vw,54px)/1.15 var(--serif);text-wrap:balance;overflow-wrap:anywhere}
.byline{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;padding-block:10px;border-top:3px solid var(--rule);border-bottom:1px solid var(--rule);font:11.5px/1.4 var(--mono);letter-spacing:.1em;color:var(--muted);margin-bottom:28px}
.byline b{color:var(--ink)}
.r-body{font-size:var(--fs,17px);line-height:var(--lh,1.9);overflow-wrap:anywhere}
.r-body>*:first-child{margin-top:0}
.r-body p{margin:0 0 1em}
.r-body>p:first-of-type:not(:empty)::first-letter{float:left;font:900 3.4em/.86 var(--display);padding:4px 10px 0 0}
.r-body :is(h1,h2,h3,h4,h5,h6){font-family:var(--serif);line-height:1.35;margin:1.8em 0 .6em;scroll-margin-top:110px}
.r-body h1{font-size:1.55em;border-bottom:1px solid var(--rule);padding-bottom:.3em}.r-body h2{font-size:1.3em}.r-body h3{font-size:1.12em}.r-body :is(h4,h5,h6){font-size:1em}
.r-body a{text-decoration-thickness:1px;text-underline-offset:3px}
.r-body blockquote{margin:1.4em 0;padding:.9em 0 .9em 1.2em;border-left:3px solid var(--rule);background:var(--surface);font-style:italic}
.r-body blockquote p:last-child{margin:0}
.r-body hr{border:0;height:6px;border-top:3px solid var(--rule);border-bottom:1px solid var(--rule);margin:2em 0}
.r-body :is(ul,ol){padding-left:1.4em;margin:0 0 1em}.r-body li{margin:.25em 0}
.r-body code{font:.86em var(--mono);background:var(--surface);padding:.1em .35em;border:1px solid var(--hair)}
.r-body pre{margin:1.3em 0;padding:14px 16px;overflow-x:auto;background:var(--surface);border:1px solid var(--rule);font:13.5px/1.7 var(--mono)}
.r-body pre code{background:none;border:0;padding:0;font-size:1em}
.r-body .tbl{overflow-x:auto;margin:1.3em 0}
.r-body table{border-collapse:collapse;width:100%;font-size:.88em;line-height:1.6}
.r-body th{font:600 11px/1.4 var(--mono);letter-spacing:.1em;text-align:left;padding:.6em .7em;border-bottom:2px solid var(--rule)}
.r-body td{padding:.55em .7em;border-bottom:1px solid var(--hair);vertical-align:top}
.r-body img{display:block;max-width:100%;height:auto;margin:1.4em auto;border:1px solid var(--rule);filter:grayscale(1) contrast(1.15)}
.r-body details{margin:1.2em 0;border:1px solid var(--rule);padding:.6em 1em}
.r-body summary{cursor:pointer;font:600 13px var(--mono);letter-spacing:.06em}
.r-body mark.clip{background:var(--mark);color:inherit;border-bottom:2px dotted var(--ink);cursor:pointer}
.r-body .endmark{display:inline-block;width:.6em;height:.6em;margin-left:.35em;background:var(--ink);vertical-align:.05em}
.r-empty{padding:32px 0;font-style:italic;color:var(--muted)}
.r-toc{position:sticky;top:110px;max-height:calc(100dvh - 140px);overflow:auto;font:12.5px/1.5 var(--mono)}
.r-toc h4{margin:0 0 8px;padding-bottom:6px;border-bottom:2px solid var(--rule);font:700 13px/1 var(--display);letter-spacing:.14em}
.r-toc a{display:block;padding:6px 0 6px 10px;border-left:2px solid transparent;text-decoration:none;color:var(--muted)}
.r-toc a.l2{padding-left:22px;font-size:11.5px}
.r-toc a.on{color:var(--ink);border-left-color:var(--ink)}
.r-toc a:hover{color:var(--ink)}
.pn{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:40px}
.pn a,.pn span{display:block;padding:14px 16px;border:1px solid var(--rule);text-decoration:none;min-width:0;transition:background-color .1s steps(2),color .1s steps(2)}
.pn span{border-style:dashed;color:var(--muted);font:12px var(--mono)}
.pn a:hover,.pn a:focus-visible{background:var(--ink);color:var(--paper);outline:none}
.pn small{display:block;font:11px/1.4 var(--mono);letter-spacing:.12em;opacity:.7;margin-bottom:4px}
.pn b{font:700 16px/1.4 var(--serif);overflow-wrap:anywhere}.pn .nx{text-align:right}
.aa-panel{position:absolute;right:0;top:calc(100% + 8px);width:250px;padding:14px;border:1px solid var(--rule);background:var(--paper);box-shadow:4px 4px 0 var(--hair);z-index:6}
.aa-panel .row{margin-bottom:12px}.aa-panel .row:last-child{margin:0}
.aa-panel small{display:block;font:11px/1 var(--mono);letter-spacing:.12em;color:var(--muted);margin-bottom:6px}
.seg{display:flex}.seg .btn{flex:1;border-radius:0;margin-left:-1px}
.pop{position:fixed;z-index:30;display:flex;gap:4px;padding:4px;border:1px solid var(--rule);background:var(--paper);box-shadow:3px 3px 0 var(--hair)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:40;padding:9px 16px;border:2px solid var(--rule);background:var(--paper);font:11.5px/1 var(--mono);letter-spacing:.12em}
.drawer{position:fixed;top:0;bottom:0;right:0;z-index:35;width:min(420px,92vw);display:flex;flex-direction:column;background:var(--paper);border-left:2px solid var(--rule);box-shadow:-8px 0 0 var(--hair);padding-top:env(safe-area-inset-top,0px)}
.drawer header{padding:20px 20px 14px;border-bottom:3px double var(--rule)}
.drawer header h3{margin:0;font:700 20px/1.2 var(--display);letter-spacing:.06em}
.drawer header p{margin:4px 0 0;font:11.5px var(--mono);color:var(--muted)}
.drawer ol{list-style:none;margin:0;padding:0;overflow:auto;flex:1}
.drawer li{padding:14px 20px;border-bottom:1px solid var(--hair)}
.drawer li .m{display:flex;justify-content:space-between;gap:8px;font:11px/1.4 var(--mono);color:var(--muted);margin-bottom:6px}
.drawer li .m button,.drawer li .m a{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-decoration:underline}
.drawer li q{display:block;quotes:none;border-left:2px solid var(--ink);padding-left:10px;line-height:1.7}
.drawer .none{padding:24px 20px;font:13px/1.8 var(--mono);color:var(--muted)}
.drawer footer{display:flex;gap:8px;padding:14px 20px calc(16px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--rule)}.drawer footer .btn{flex:1}
.dim{position:fixed;inset:0;z-index:34;background:rgb(0 0 0 / .3)}
@media (max-width:980px){.r-grid{grid-template-columns:minmax(0,1fr)}.r-toc{display:none}}
@media (max-width:560px){.pn{grid-template-columns:1fr}.pn .nx{text-align:left}.rbar .hide-s{display:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

const BODIES = {"P16": "<details>\n<summary>\n[lindaislazy086@gmail.com](mailto:lindaislazy086@gmail.com)\n</summary>\n[Wang Chulin](mailto:lindaislazy086@gmail.com小猫松饼\n<p>Hi Luliy Cooper</p>\n<p>我认真把你的这篇文章从头到尾看完了，也看得很慢。其实看到最后，反而觉得，你写的并不是\"为什么我会失败\"，而是在问一个更深的问题------**为什么我明明知道自己想成为什么样的人，却总是成为不了那样的人。**同时能感觉到，你一直在和两个自己对话。一个自己，对世界充满好奇，喜欢阅读，喜欢思考，希望有一天能够去更远的地方，看更多的风景，遇见更多有趣的人，也希望能够真正掌控自己的人生；另一个自己，却一次又一次沉溺于短视频、游戏、熬夜、抽烟这些能够带来即时快乐的事情里。当快乐结束之后，剩下的又是自责、焦虑和失望。最让我触动的，不是你说自己失败，而是你一直没有放弃那个理想中的自己。你在文里反复提到\"内心丰盈\"\"探索世界\"\"阅读\"\"与优秀的人交流\"，这些其实都说明了一件事------你的精神世界并不贫瘠，相反，你一直在寻找一种真正值得自己去过的人生。只是现实里的自己，暂时还没有能力跟上理想里的自己，所以你才会如此痛苦。</p>\n<p>有一句话让我停下来想了很久。**\"****悔恨昨日之我，厌弃今日之我，却仍妄图拼尽全力去拯救那个尚未到来的、明日的我。\"**我觉得，这句话几乎写出了很多人的状态。我们总是在责怪过去的自己，又对现在的自己不满意，却把所有希望寄托给未来的自己。可是未来那个更好的自己，并不会突然出现，他也是今天这个不够完美、会迷茫、会懒惰、会焦虑的人，一点一点走过去的。还有一点，其实很想和你说。你一直在用\"失败\"这个词形容自己，但在我看来，一个真正失败的人，大概不会花这么长的篇幅去反思自己，也不会去思考什么是成功、什么是内心丰盈、什么是自己真正想要的人生。真正可怕的，不是迷茫，而是麻木；不是暂时停滞，而是连追问都不再追问。</p>\n<p>当然，我也能理解你的无力感。因为很多时候，最痛苦的不是不知道该怎么做，而是明明知道，却始终做不到。理智和行动之间隔着一道很长很长的鸿沟，这种落差会一点点消磨一个人的自信，让人开始怀疑是不是自己天生就不够坚定、不够优秀。但我想说的是，或许你对自己太苛刻了。你总是在期待一次彻底的改变，希望有一天自己能够忽然变成那个每天读书、每天学习、自律、坚定的人。可现实里，大多数人的成长，都不是一场轰轰烈烈的蜕变，而是无数个不起眼的今天。昨天多读了十页书，今天少刷了半小时视频，明天早睡了二十分钟，这些看起来微不足道的小事，最后才慢慢拼成了一个新的自己。</p>\n<p>还有，你说自己孤独，说身边没有可以深聊的人，所以才会把这些话写出来。我其实很感谢你愿意写这些，也愿意让别人看到一个并不那么光鲜的自己。能够这样坦诚地面对自己的脆弱，本身就需要很大的勇气。我没有办法告诉你人生应该怎么走，因为我想，每个人都只能找到属于自己的答案。但至少我想告诉你一件事：读完你的文章之后，我没有觉得你是一个失败的人，我只觉得你是一个还在路上的人。你现在或许还没有成为自己理想中的模样，但至少你没有停止寻找。很多人二十岁就已经停止思考了，他们按部就班地生活，甚至从未问过自己真正想要什么。而你还在问，还在困惑，还在寻找，这本身就是一种很珍贵的能力。希望有一天，当你再回过头来看今天写下的这些文字时，你不会觉得它们只是痛苦的记录，而会觉得，它们是你真正开始认识自己的起点。也希望那个你一直想成为的人，不会在某一天突然降临，而是在未来某个很普通的下午，你忽然发现，原来自己已经慢慢靠近他了。</p>\n</details>\n<details>\n<summary>\n[2408242096@qq.com](mailto:2408242096@qq.com) ↔ [2408242096@qq.com](mailto:2408242096@qq.com)\n</summary>\n[2408242096@qq.com](mailto:2408242096@qq.com) 你好\n<p>看了你给我写的信，我感觉很被震撼，你真的真的完全抓住了我的心，你想讨论的话题也完全是我想讨论的，甚至我的心脏有一种发紧的感觉------也有可能是我刚刚喝了太多泰奶</p>\n<p>虽然我们不认识，但是此刻我给你写信的心已经完全不受控制了，我们是此刻的灵魂挚友</p>\n<p>先讲个放松的题外话，你是文科生吗？你的文笔很好，我很久不写东西了，下面写的内容可能有点混乱，见谅</p>\n<p>OK，回到正题，我最近明明知道自己应该做什么，但是就是被短视频攫取注意力，难以行动的困扰，和你一样，我的学校也一般，也同样不甘于此，想要改变什么又不知道未来自己应该做什么，怎么发展</p>\n<p>但是我和你也有一些小小的不同，我大概知道我应该往哪个方向尝试，举个例子，我现在在准备做ai智能体服务和学习英语，未来我打算考研和轻创业</p>\n<p>想要找到一个或者几个大概的方向是很简单的事情，现在是信息大爆炸的时代，我们每天接触的密密麻麻的事物，随便找几个自己感兴趣的方向研究，就算是三分钟热度也足够充实了自己了，比如最近很火的ai工作台</p>\n<p>找到大概方向之后，最难的就是开始，关掉不用的app，清掉后台，放一个轻音乐，干就完了</p>\n<p>正好现在是暑假，没事可做，没人打扰，开始了就是成功</p>\n<p>对了，真正开始之后整个人的状态都会发生改变，上个学期我开始恶补英语四级和健身，一切都进展得很顺利，一天甚至可以背200个单词也不会觉得太累，反而很充实，一切都顺利的难以想象，甚至在开始改变之前，我还是个因为旷课被导员约谈的问题学生</p>\n<p>就我个人来说，改变就从睡个好觉开始，然后是一个合适的环境，去图书馆最好，咖啡馆也不错，不也很多钱，十几块就够够的了，这些地方可以提供\"开始\"需要的氛围，真正稳定之后，这种氛围就可有可无了，这时候在家或者在宿舍也能沉静下来</p>\n<p>但是上学期发生一些不好的事，我在宿舍生活得很难受，考完四级之后，我就无法抑制的陷入近乎抑郁的躯体化症状里，从放假到现在，我都在慢慢治愈自己，这几天我也在重新开始想要回到正轨回到之前充实的状态</p>\n<p>我之前也想过这种充实的状态到底有没有意义，我背单词健身兼职对我个人发展的有没有真正的效果，还是只是在感动自己...现在我发现真正对我有意义的评判标准，不是四级过不过，身材有没有练好，而是我能不能处于一个自洽且感到幸福的稳定生活状态里</p>\n<p>只要我在过这种稳定的自洽的丰荣的生活，我就是成功的，世俗的成功追求的不就是有足够的时间足够的财富足够的权利换来幸福吗？</p>\n<p>这只是我的一点愚见，仅由我的个人生活经验得出，我希望看到又你的生活经验得出的看法</p>\n</details>\n<details>\n<summary>\n[dddd44440712@163.com](mailto:dddd44440712@163.com)亲爱的baimingyue\n</summary>\nz [dddd44440712@163.com](mailto:dddd44440712@163.com)亲爱的baimingyue:\n<p>​见字如面，你好！</p>\n<p>​<br>\n你的来信对我来说并不算打扰。高考结束之后，出于各种原因，我会有一些自由支配的时间。把邮箱发出去，也是因为身边很少有可以和我deeptalk的朋友，我是乐意去聊一些什么的。</p>\n<p>​<br>\n你说你想从心境开始聊起。你在信里写\"所求即所得，日日心安，不为焦虑所困，不为内耗所噬，人生能循着自己所愿的方向徐徐铺展\"------我理解，你首先希望对自己的命运有一种掌控感。你又提到，希望保持对世界永不熄灭的好奇，去探索这个世界。所以才会谈到那些\"日子过得丰盈安稳\"的愿景。但你也承认，现实里的日子并不安逸，被短视频和各种即时娱乐填满了。（可能和你想表达的有所出入，我这几天状态有点疲惫，脑子不太清楚，见谅见谅）</p>\n<p>你说你高考失利、读了所谓的三本，不会赚钱，吸烟成瘾，长期不注重健康，觉得自己失败。可是从你这封信来看，我觉得你是一个很谦卑的人，也不觉得你是一个真正意义上的失败者。我很少见到一个真正失败的人，能这样坐下来认真剖析自己的人生。也很少有一个真正沉湎于娱乐、大脑空空的人，会有这么深刻的思考、上进的心态。你的文笔很好，行文也很有逻辑，给我一种层层剥开的感觉。非常明显，你并不是他们口中那种\"失败者\"，你只是暂时受困，有些迷茫。可谁的二十岁不迷茫呢</p>\n<p>​<br>\n你说你来自小城，内心孤僻，向往更广阔的风景，也提到了想要探索世界，想要那种心灵相击的震颤。但你又觉得，刷短视频、玩游戏、看感官刺激的影像、点一支烟------这些轻易的欢愉并不能填平你心中的郁结。</p>\n<p>其实，想要改变，或许可以从一些小事开始。心态的改变，有时候需要一些小事情去积累和点燃。</p>\n<p>比如你说你爱阅读，喜欢那种灵魂共鸣的感觉，喜欢与卓越之人对话。单凭这一点，你就已经不是一个失败的人了------甚至可以说，你在某方面是成功的。我曾经在一段关系里，发给对方一段三毛的散文，他跟我说没太读懂。我当时更多的是一种无力感，（也有那段关系本身的原因）但也不能怪他，他确实是没读懂。所以你能读下去、读进去，并且发自内心地热爱，这已经是一部分的成功了。</p>\n<p>​<br>\n你说你无法在任何一件事上做到真正的心无旁骛，但沉醉于那种心灵相击，本身也需要一种专注啊。去阅读的时候，如果不专注，又怎么能达到那种心灵共鸣的感觉呢？你说你心中有话想说却词不达意，可如果你现在这种表达都算词不达意的话，那也是不低的文学造诣了。</p>\n<p>​<br>\n至于视频和游戏日复一日地攫取你的专注，或许可以尝试选择一些其他的娱乐方式来替代。比如你吸烟、打游戏、刷视频的那些时间，可以把他们换成别的，你有没有想过运动呀？可能是羽毛球，可能是滑板，哪怕只是简单的跑步也可以。高三的时候有段时间我压力很大，或者感到空虚，晚上回家学习提不起动力，就会去跑步。那时候已经挺晚了，十点多吧，我就去操场跑两圈。晚风吹在脸上特别舒服，出一点汗，回家时心情是惬意的，又带着一种沸腾过后将平未平的状态，整个人精神很亢奋，能学更久。</p>\n<p>​<br>\n如果你怕自己无法专注，但是又喜欢阅读，那可以试试去书店。我有时候会去书店，待一个下午，坐在那里能读完大半本书。在那种安静的环境里，捧着书，更容易沉浸，不容易被分散注意力。如果你怕时间不知不觉流逝，可以带一个那种便携式的挂钟。我之前为了防止自己看手机，会在桌面上放一个挂钟，把手机收起来，通过挂钟来掌握时间。</p>\n<p>​<br>\n另外也可以尝试一种比较自洽的旅游方式。不知道你有没有刷到过------有人分享过一种玩法，就是坐上这个城市的公交车，漫无目的地坐下去，一直到终点站。你可以真实地观察到这个城市的风貌，他们说这种方式能更好地观察城市。这也是我当初所想的。曾经有一段时间，打卡式旅游特别火，但我不明白那样的旅游有什么意义，只能让我身心俱疲------对着景点一身汗，盲目地举着镜头，僵硬地笑......所以我会更多地去选择自己感兴趣的内容。比如去博物馆。去青岛的时候，我第一站就去了啤酒博物馆，B馆会讲啤酒工艺和历史，我在那里了解到了啤酒花，最后有一个生产端流水线的制作过程，也挺有意思的。总体来说，啤酒博物馆是我青岛之行收获最大的地方。(当然如果是旅游高峰期去排队是很闹人的，最好提前预约。并且选一个当天内早一点的时间<br>\n否则特别热)<br>\n我还遇到了一个本地老大爷，给我讲青岛的建筑和历史。去了海边，有新人在拍婚纱照，也算是见证了一场浪漫吧。进到教堂里，正巧碰上琴师弹奏一首乐曲，我不知道那是什么曲子，圣歌一类的吧，很空灵，在教堂里回荡，整个人都被洗涤了。我录了视频，可以发给你看，我觉得那个很有意思。（不方便也没关系）</p>\n<p>所以我觉得旅游可以是一种消遣生活的方式。如果你生活比较繁忙，抽不开身的话，可以趁着短暂假期出去玩一两天，比如双休，去附近的城市。我其实就在山东的一个小县城，青岛对我来说，坐大巴或者高铁几个小时就能到。选择一个比较近的城市，去玩几天。有个软件叫\"圆周旅迹\"还是什么来着，好像叫行程助手之类的，挺好用的。你把目的地输进去，它会帮你规划路线，还可以查交通。去了之后，一边看着地图一边走，有时候问问当地的本地人，坐公交、坐地铁都可以，而且很省钱。（个人觉得地铁的舒适度更高，也更划算）我是第一次坐地铁，一切都是很新奇的体验。有些东西真的去尝试以后，发现没有那么困难。只是迈出那一步的时候充满了忐忑，但跨过去了就好了。</p>\n<p>​<br>\n所以，我们有很多事情可以开始。如果不能出门远行，也可以留心身边细微的事物。有一次我从课外班下课，路过一个小区，那种别墅式的小区，有一大墙的蔷薇从花架上倾泻下来，特别美。他们那边种了很多树，有一次是秋季，落叶落在石头做的大水槽里，浓紫色，浅褐，橙黄，深棕...特别漂亮。我当时感叹，怎么会这么美。我之前从来没有注意过这个地方。我们那条街周围种着老梧桐树，是那种法桐，你站在街口往远处看的时候，很有那种小城的味道------悠闲自在的感觉，一切都很宁静，淡然又幸福。</p>\n<p>说了这么多，杂七杂八的，其实想说的就是：可以通过阅读，或者做一些你喜欢的、能学到东西的、有意义的事情，来丰盈自己的世界。也可以选择听播客，听播客是很好的输入方式。我有时候会看詹青云打辩论赛，如果你觉得辩论赛太长看不下去的话，可以看她的账号，微信视频号或者抖音都有，里面会有一些和庞颖讨论的小话题，有的关于爱情，有的关于人生规划，都是一些比较深刻的话题，并不算很长，有的可能三五分钟，长的顶多十分钟。与其刷那些无意义的视频，不如选择一些有内容的，比如地理类、财经类、自然类、科学类的短视频，或者去看纪录片。我觉得纪录片是一个让人静心和专注的好东西。</p>\n<p>我是文科生嘛，我们老师曾经推荐我们去看纪录片增长视野。我当时看的是《楚国八百年》，挺有意思的。如果你喜欢有趣味一点的，我记得小学的时候看过B站的一部，好像是叫《神秘博物馆》吧，讲画家、雕塑家类的艺术家的故事，也挺有意思的。你可以多试一试。（高中上美术课的时候看过很多科普的公众号和视频，你需要的话，我可以回去给你找一找，不知道还能不能找到）</p>\n<p>​<br>\n想要探索世界的话，也可以选择做志愿，我觉得是很好的事情。我去医院做过志愿，有一次在妇产科那边，有很多孕妇来产检，我就帮他们记录、调试设备，对我来说是很新奇的体验。我第一次近距离接触那么多孕育着新生命的女性，她们有的是老公陪着，有的是自己来的，会和医生聊一些家常。从她们身上，可以了解到她们生活中的琐事和小趣事，我觉得挺有意思的。当时值班的护士带着她的小孩，那个小姑娘特别可爱，还给我画了画像。做志愿的时候，你会感觉到和这个世界的人有了更多的联结，更真实和多方面的触摸到这个世界。很有意义的事情。</p>\n<p>​<br>\n旅游也是，可以选择自己感兴趣的东西去看------博物馆、美术馆、海、山，说不定也会遇到一个本地人和你聊天，跟你讲当地的历史、建筑、风景，还有地道的饭馆。我去青岛的时候还去了农贸市场，自己挑海鲜，然后去啤酒屋加工，也非常有意思。那些摊贩老板有的特别实在。我去买鲍鱼，一开始说六块一个，称的时候我还了一下价，说五块吧，最后称多了，也给我按四块一个算了。老板是个很和善的老太太，笑容满面，会很慈爱友好的看着你。她问我要不要花蛤，五块钱给你拿着吧，我自己也实在吃不完了。我说行，就又拿了一大袋。一共花了二十五块钱左右，然后去海鲜加工，做出来是一大盘蛤蜊和一盘鲍鱼，那个老板手艺也特别好，有滋有味，口碑很好的一家。</p>\n<p>​哎呀，又说多了。</p>\n<p>总之，也许你缺的只是一个可以出发的契机，或者一个沉浸下来的环境。你可以试着选一样去试试。</p>\n<p>这些都只是我不成熟的想法，和漫无边际的闲聊，希望能缓解你的焦虑，或者对你有那么一点点帮助。赐教算不上，只是一个不成熟的小女孩的碎碎念。</p>\n<p>写到这里依旧感叹你凝练的文笔和深刻的思考，能看出来你应该是一个很有内涵的人，绝非言之无物。非常抱歉写得有些随意，最近这几天状态不怎么好，是用的语音转文字，也或许这样的文字不会增加你的阅读负担...</p>\n<p>总之，祝你一切顺利。</p>\n<p>如果你还想继续讨论的话，也随时欢迎。</p>\n<p>​<br>\n上一封信写得有些散，回头看了看，说了很多我自己的经历，却没能真正走进你信里那种沉闷的困顿里。非常抱歉，所以决定再补一些话。</p>\n<p>你在信里说的\"日复一日地攫取着我的专注，无力与之抗衡\"，这种感觉我也有过。明知下一秒就感到空虚、下一秒就会后悔，但还是滑下去了。我高考刚刚结束之后，有过一段这样的日子。离开了学校里规律的生活，时间突然全是自己的了，反而不知道该怎么办。于是刷手机，刷到眼睛发酸，坐着刷到天黑，然后头疼地躺在床上。巨大的失落感会涌上来，那是一种什么都没做的恐慌。你信里写的\"悔恨昨日之我，厌弃今日之我，却仍妄图拼尽全力去拯救那个尚未到来的明日的我\"，我也体会过。我能明白那种别扭。</p>\n<p>至于你问自己为什么\"明明热爱阅读却坚持不下去\"，我有一个不成熟的想法，不一定对，会不会是因为你把\"坚持\"想得太重了？一件事一旦开始，就必须持之以恒、日复一日嘛？人生里大多数事情是断断续续的。三天打鱼两天晒网也不会怎样。两天晒网的时候，你也是在休息、也在想昨天打上来的鱼。（可以理解为一种自我修整）读书这件事，只要还在读，哪怕中间隔了很久，也会你身上起作用，是一种潜移默化的状态。那些\"心灵相击的震颤\"不会因为放下书就消失。我读你信的时候就在想，一个内心麻木的人写不出这样的文字，你比自己想象的要好很多。</p>\n<p>你说你缺少一个\"能持之以恒的事\"，但是，写这封信算不算一件？坐下来面对自己、把自己的病灶一层层剥开、坦诚地寄给我，一个陌生人。这本身不就是在坚持和挣扎吗？这比读一本书难多了。</p>\n<p>我不打算给你太多建议了，因为上一封信给得够多了，反而可能给你压力。（很抱歉）有时候，真正拖住我们的，可能不是动作本身，是做完之后对自己的厌恶。刷一个视频可能就三五分钟，但可能会懊悔多次，反复自责（不知道你会不会这样）</p>\n<p>你信里说你孤僻、没有可以深谈的人，但其实你已经在往外面走了。你写了这封信，把它寄出去，你把内心挣扎的一面写给我，我觉得这已经是很大一步了。</p>\n<p>谢谢你的信任，祝好。</p>\n<p>你的笔友z</p>\n</details>\n<details>\n<summary>\n[3171711078@qq.com](mailto:3171711078@qq.com)\n</summary>\n(mailto:[3171711078@qq.com](mailto:3171711078@qq.com))\n<p>亲爱的Luliy Cooper：</p>\n<p>谢谢你愿意写下这么长的一封信，把心里那些缠绕的思绪一字一句地整理出来，发给一个素未谋面的陌生人。你的文笔让我惊叹。读到\"悔恨昨日之我，厌弃今日之我，却仍妄图拯救明日的我\"时，我觉得能写出这样句子的人，心里的那点火一定还没灭。</p>\n<p>你信里说，不把高考失利、不会赚钱这些看作真正的失败，因为你对失败有更深的理解，指向的是内心的丰盈与从容，而非身外之物。这一点我很认同。只是这个世界走得太快了，快得让人来不及沉下来，就已被裹挟进那些转瞬即逝的欢愉里。你说自己沉溺其中，我又何尝不是呢？感谢你的来信，让我从视频的惯性中抽离出来，重新回到这种缓慢的、需要耐性的思考里。</p>\n<p>关于对未来的忧惧，我也能理解。我从小就想当一名老师，这个念头从小学起便在心里扎了根，至今未变。可即便有这样一个清晰的目标，我仍然会怕------怕有一天做不了热爱的事，怕被生活推着走向一条自己并不想走的路。后来我想，未来之所以让人恐惧，正是因为它充满了未知；而当下是确知的，我们能把握的，也只有当下。这是我目前找到的、让自己稍稍安定的办法。</p>\n<p>你说自己从未真正坚持过什么。但我觉得，持之以恒地做一件事，确实很难，它需要长久的毅力和决心。如果心中怀着热爱，或许能走得更远一些吧------热爱可抵岁月漫长，这句话我是信的。我高中时开始爱上阅读，是受一位朋友的影响，后来我的习惯又传给了别的朋友。那种\"好的东西在人与人之间流动\"的感觉，让我觉得读书这件事本身，就已经在回馈我了。虽然现在我也常常在短视频里消耗时间，但偶尔能重新翻开一本书，那个瞬间就像一次小小的自救。</p>\n<p>那些浅薄而即时的欢愉，确实容易让人沉迷。我自己也还在与它们周旋。目前我唯一找到的解药，大概就是\"行动起来\"------不管多小的一件事，只要开始做了，那种\"我在往前\"的感觉，就能把人从泥潭里拉出来一点点。</p>\n<p>你说自己生于小城、内心孤僻，却仍渴望丈量这个世界。我想说，平凡与不甘平庸，并不矛盾。我们不得不承认自己的平凡，但不甘平庸是好的------它让人保持着对生活的热爱，也让人愿意去发现自己身上那些独特的东西。你能写出这样一封信，就已经是证据了。</p>\n<p>我资历尚浅，阅历也不丰富，无法给你一个满意的回答，更谈不上\"赐教\"。只是你的信让我想起很多自己的事，便把这些零碎的念头写下来，权当一种隔空的陪伴吧。</p>\n<p>若你愿意，我们可以继续通信。等我们都再走一段路，或许会有新的话可以说。</p>\n<p>祝安好</p>\n<p>你的笔友</p>\n<p>柒</p>\n</details>\n<details>\n<summary>\n[nccyy0913@163.com](mailto:nccyy0913@163.com) ↔ [nccyy0913@163.com](mailto:nccyy0913@163.com)\n</summary>\n[nccyy0913@163.com](mailto:nccyy0913@163.com)\n<p>很高兴收到你的来信<br>\n你说这是一件小事，可我觉得不小。一个人愿意把剖开的自己摊在纸上，递给另一个陌生人，这件事本身就够郑重了。谢谢你信任我，也谢谢你那些坦诚<br>\n你可能遗憾自己为什么失败。可我读下来，倒觉得你离\"失败\"这个词很远很远。一个真正失败的人，不会在娱乐的间隙里反复责备自己，不会在刷完视频后感到虚无，更不会写这么长一封信来试图理清自己的病灶，可能只是你现在处在困顿中，就像你心里那点火没灭，它只是烧得不太舒服------闷着烧，烟大，焰小，但它在，你的希望仍然有几分光。关于你说你不能坚持，如果不感兴趣的事要不就试试不要开始？关于空虚时光的消遣我认为是很有必要的，毕竟有的时候一些垃圾信息也很有帮助，可能现在没有，但是以后可能会突然发挥它的热量。包括如果你有类似孔乙己长衫这类包袱，不要舍弃它，试着与不同的人交流，就像你给我写信一样<br>\n你问我能否赐教。我没有什么大道理能赐，只想说：你没有自己想象中那么糟糕。你只是还在路上，而这条路本身就弯弯曲曲，那些让你悔恨的昨日，其实也让你长出了对昨日悔恨的能力------这本身就是一种敏锐的知觉。很多人麻木地过完了，连悔恨都没有<br>\n愿你今夜，哪怕只有一刻，不再厌弃今日之我</p>\n</details>\n<details>\n<summary>\n[cltin2026@qq.com](mailto:cltin2026@qq.com) ↔ [cltin2026@qq.com](mailto:cltin2026@qq.com)\n</summary>\n[cltin2026@qq.com](mailto:cltin2026@qq.com) 许如愿\n<p>展信佳。</p>\n<p>不好意思隔了这么久才回复你，前段时间手头一堆事情忙得焦头烂额，一直没能静下心好好回信。</p>\n<p>认认真真看完了你写的长长的信，心里挺有感触的。</p>\n<p>能感觉到，困住你的从来不是三本的学历，也不是熬夜、容易沉迷短视频这些表象。最折磨人的是：你心里清楚自己想要什么样的生活，向往丰盈、从容，不甘心困在原地，但现实里总是很难稳住心神，一次次滑进短视频、游戏这种轻松的快乐里。热闹过后只剩下强烈的自责，循环往复，不停和自己较劲。</p>\n<p>其实真的不用这么严厉审判自己。生活里那些唾手可得的欢愉，本来就是用来填补孤独的。很多人都和你一样，不是意志力太差，只是长远目标带来的满足感太慢，很难对抗立刻就能获得的快乐。</p>\n<p>看到你的文字，我也想起一段埋藏很久的经历。自从艺考失利之后，我消沉了很长一段时间。曾经我十分热爱音乐，作为艺术生投入了大量时间练习，满怀期待奔赴考试，最后却没能收获想要的结果。那段时间总觉得这次失利就等同于全盘失败，甚至觉得再也不愿意触碰和音乐相关的东西。</p>\n<p>现在我虽然没有继续系统学习音乐，但那段经历带给我的馈赠一直都在。曾经无数次练习、在舞台下放声歌唱的日子，慢慢磨练了我的心态，让内心变得愈发强大。如今不管是朗诵还是主持，即便没有受过专业系统的培训，我的作品也能够登上国赛的舞台，面对人群、站在舞台上的时候始终可以从容自信。</p>\n<p>我慢慢想通，其实不能简单把过往的经历定义成失败。正是当初所有的体验塑造了现在的我，彼时的那个我，成就了如今的我。回头再看，失败远远没有自己想象中那么可怕，所有难熬的时刻，终究都过去了。</p>\n<p>你心里那份名校情结、想要走出去丈量世界、期待和思想同频的人交流的想法，我完全理解。拥有向往从来不是负担，可怕的是一边心怀远方，一边持续内耗，消耗掉自己所有行动力。</p>\n<p>我很赞同你的观点，成功从来不是有钱、拥有名望。只是追寻内心从容这件事，本来就没有标准答案，也不存在速成的办法。你想要探寻那些最根本的问题，暂时找不到答案也没关系，人生很长，不必逼迫当下的自己立刻找到谜底。</p>\n<p>还有，不要因为暂时没法持之以恒，就否定全部的自己。你热爱阅读，可以在文字里寻到共鸣，愿意不断反思自我，这已经是很珍贵的特质了。坚持这件事本来就很难，没有人可以永远保持高度自律，偶尔松懈、摆烂，都是人之常情。</p>\n<p>前路未知的忧虑，每个人临近毕业阶段都会有。不必强求自己马上规划好一生的道路。不用立下宏大的目标，可以试着从小事入手，不用一刀切彻底戒掉娱乐，慢慢找到消遣和自我提升之间的平衡点。</p>\n<p>不用急于\"治好\"当下的焦虑，和自己短暂的惰性试着共存一段时间也无妨。不必期待一觉醒来，明天的自己就能焕然一新。</p>\n<p>如果你想继续聊聊，我很乐意倾听。</p>\n<p>祝安好</p>\n<p>许如愿</p>\n</details>\n<details>\n<summary>\n[yyyy044066@qq.com](mailto:yyyy044066@qq.com)\n</summary>\n[yyyy044066@qq.com](mailto:yyyy044066@qq.com)\n<p>亲爱的Luliy Cooper:</p>\n<p>你好，我已经收到了你的来信。</p>\n<p>有一句话或许能给你带来一些启发:\"实迷途其未远，觉今是而昨非\"。我私自认为这是比较贴切先生当下的一些心态境遇的，看过你的信之后，我一定要说的第一句话是:</p>\n<p>​<br>\n\"失败并非都是沉重的话题，人的一生不可能全是失败，也绝对不会是彻底的成功，它们都是自身和机遇作用下的结果，既然人的失败与人的成功无法比较可能性，与其思考人为何会失败，不如思考人为何会成功，人如何能成功，以及如何看待\"相对沉重\"的失败。\"</p>\n<p>在此，我能够感受到当你落笔予我的信时，你的内心是难以平静的，或许有着懊悔，有着不甘，也有点害怕，所以有些慌，有些恼。我认为比起鸡汤，一些真心的建议更能够让你安心。首先我们思考一个问题:面对高考的不如意，你如何选择，是开启高四生活，还是选择步入新的大学阶段呢。两者并无对错，也各有利弊。若是重返高四，你要考虑当下新高考题目活，题目新，考能力的大趋势，我们是否具有自己本身的一些基础和稳定性呢。若是选择开启大学生活，就坦然接受吧，归根结底，这件事情，又能够去怪谁呢，谁都没有错，可是大家都会产生不甘与懊悔，我们都有一颗向上的心，但，这次的事情，我们真的太难去决定这一切了。我并不知道你的失利到了哪种程度，如果愿意分享的话，可以讲讲你的平常水平吗？总结一句话就是，如果不服，那就重来，如果接受，那就莫过度陷入自责的陷阱，每个人都会经历失败，你也终会拥有属于你的成功。</p>\n<p>然后，我不认为抽烟酗酒诸如此类不爱护身体的行为是一种失败，这只是一种个人选择，在有情绪无处发泄之时，它们并非毫无作用，这不是麻痹，而是在帮你渡过最不清醒理智的时候，避免你的冲动选择，尽管宿醉之后会头痛，但我们总是能静下心来思考的，不是吗？（当然我也有为自己找借口的一些成分在里面吧，我觉得抽烟喝酒也没什么呀，说不好听点，这有什么大不了的，作贱自己身体轻而易举，这也能叫做失败吗？）正如戊戌变法多少仁人志士殚精竭虑，却因复杂的历史因素失败，功亏一篑，是光明的黯淡，是心血的辜负，个人不良习惯，何足称为失败？</p>\n<p>关于对内心丰盈的渴望，与自控力不足享受瞬时娱乐之间的矛盾，我只能说，正是事物的矛盾运动才能推荐它的前进，一些渴望与娱乐它们是不可缺少的动力与减压方式，或许以下的问题，能给你方向。两者的重心如何安放？两者之中有一定对或不对的主体吗？故而我们不能犯虚假两分的错误，任何事物都有其利弊，都具有价值。</p>\n<p>我相信你是一个有自己主见的人，所以说我相信与其直接给你建议，不如引导你去思考，或许你会思考的比我更合适，因为未来的道路，属于你。</p>\n<p>结尾提一句，我应该是比你小一届，你的经历与我而言也有启示，所以现在，放弃幻想，开始战斗吧，毕竟你在信中，没有给出具体的解决方案，这样的烦恼又如何消愁呢。</p>\n<p>祝一切安好</p>\n</details>\n<details>\n<summary>\n零访问加密存储[ywshine522@qq.com](mailto:ywshine522@qq.com) ↔ [ywshine522@qq.com](mailto:ywshine522@qq.com)\n</summary>\nNick.[零访问加密存储ywshine522@qq.com](mailto:ywshine522@qq.com)\n<p>亲爱的笔友：</p>\n<p>你好！收到你来信时，我是既惊喜又沉重。惊喜的是我未曾想过有人会给我写信。让我感到沉重的是你的文笔让我自愧不如、所以草草下笔，希望能解答你心中的困惑。</p>\n<p>我也曾有过和你一模一样的阶段。整日把自己关在房间，不断重复那些消磨自己的习惯。烟不离手，持续熬夜，只能依靠刺激性影像才能勉强入睡。一边看不清前路，满心迷茫，一边眼睁睁看着当下的处境，却丝毫没有改变的力气。那时候我活得一败涂地，不断反复问自己：为什么原生家庭不尽人意，为什么始终沉不下心学习。内心不断地拉扯着、但现实却是我躺在舒适的沙发上玩着一局又一局的游戏。这般自杀式的内耗，整整持续了大半年。当时的我无疑认为自己是失败的，但后来我突然悟了。所谓的\"失败\"<br>\n只是当时的我给自己下的一个定义，是一个束缚自己的枷锁。<br>\n我把我的\"失败\"归根于我的原生家庭，我当时不理解为什么我父母要吵架、为什么要出国？为什么家里没有钱？是不是如果我不出国他们就不会有那么多事了。但后来才发现这一切都是我的幻想、假设。从本质上来讲，当时的我陷入内耗和焦虑是因为我的恐惧和不安。人在这种状态的时候会妄图逃避一些不愿去面临的困难和压力。而我是怎么摆脱这种困难和压力的呢？过度的向外求或向内求都不好。我们要学会的\"平衡\"容我慢慢道来。</p>\n<p>首先，换环境。环境的影响对一个人的心理健康是有很大的因素的。后来的我转学，去认识了新的人、朋友和老师。当我身处一个偏好的环境的时候、身边也是爱学习、上进的人，我自然而然地被潜移默化了。前提是不要压抑自己，不要封闭自己和别人去交流，敞开心扉。也许会有意想不到的收获</p>\n<p>其次，学会课题分离。我当时把我的失败归结于父母吵架，他们之间的感情问题和赚不到什么钱。后来我想清楚了，那是他们的感情，是他们的事。我觉得得交给他们去解决。我左右不了，我控制不了他们感情走向也控制不了他们能赚多少钱。我能做的只有淡然接受。</p>\n<p>心理学上有一个方法就是：当你能察觉到你所谓的焦虑和抑郁的情绪的时候，你的情绪已经消减了挺多的了。你要做的就是不要去强求，让它在那流动。之后再进行思考和做出相对应的行为</p>\n<p>后来我不再把失败的原因归根于外界了。我不知道你能不能懂。就是当时的我给我的\"失败\"找了一大堆借口。什么父母吵架、给不了一个很好的环境或者很多钱。本质上是一种向外求。求他们给予、施舍，得不到就摆烂和放弃自己。现在回头一想是很愚蠢的行为，相当于把自己的命运建立在别人的评判标准和施舍之上。</p>\n<p>我所理解的\"命运\"是这样：\"命\"是与生俱来的底色，是根深蒂固的性格惯性，是潜意识里觉得一切本该如此的定势。而\"运\"，是人生路上突如其来的弯道。</p>\n<p>不受外界干扰，顺着本能做出的选择，便是命；静下心思考过后，敢于逆着自身天性行事，那便是运。</p>\n<p>那段低谷里，我谈不上逆天改命，但属于我的运确实慢慢好转。我遇见了挚友与贵人，在十八岁靠着自己的努力踏上旅途，见识了更多美景。</p>\n<p>最后，我想解答困扰你许久的\"根本\"</p>\n<p>这世间充斥着太多欲望与幻象，不断拖住人前行的脚步。我始终认同，万事万物的根本，即是本质，也就是第一性原理。游戏、短视频本源只是消遣娱乐，不该沦为放纵与沉沦的借口。愿你在思索之时，能够拨开表象窥见本质，直面读懂自己的内心。</p>\n<p>你在信里说，从来难以长久坚持一件事。我想对你说：不妨持之以恒地做你自己，忠于本心，信任自身，慢慢建立属于自己完整的三观。守住为人的底线，恪守行事的准则，无论日后踏入哪一行，都足以有所收获。人最可惜的，便是走着走着遗失初心，再也认不清自己。</p>\n<p>没有人可以完全掌控命运，这本来就是不现实的。我们没办法决定自己的出身，唯一能把握的，就是不断成为更好的自己。胜过从前的自己，活好此刻的自己，静待将来的自己。</p>\n<p>道理说来容易，践行却道阻且长，你我都尚在修行途中，就此共勉。愿我们都能守住本心，看清前路，在纷繁世事里，始终不迷失自我。</p>\n<p>你的笔友</p>\n<p>Nick.</p>\n</details>\n<details>\n<summary>\n零访问加密存储[Paulachan7@163.com](mailto:Paulachan7@163.com) ↔ [paulachan7@163.com](mailto:paulachan7@163.com)\n</summary>\n[零访问加密存储Paulachan7@163.com](mailto:paulachan7@163.com) Paula CHAN\n展信佳，luliy\n<p>你的措辞非常华丽，我想我没有这样的文学成就来匹配你，所以我选择用自己最习惯的方式来回复你的这份来信。</p>\n<p>感谢你的来信，这是我目前收到的第一封，我是一个讲究缘分的人，我只随手在某一个\"欢迎来信\"的视频里很随机的留下了一个我的邮箱，我从未设想过在茫茫的评论海里有人会看到我的留言，认认真真的给我写这样一封洋洋洒洒的自我剖析。既然我们有缘，那我想也许可以分享一下我、我的人生，你是否会从中得到感悟受到启发我无从得知，但如果可以帮到你，我非常荣幸。</p>\n<p>你的这个课题太大了，我想我没办法给你很好的答案，我也只是一个传统意义上的年轻人，二十数年的人生里我无穷无尽的探索，却依然看不到一个哪怕模糊的答案。从你的寥寥数语中我推测你是一个大学还没有毕业的学生？天呐，我只想感慨一句\"真的很美好的年龄\"。</p>\n<p>我们其实有非常类似的经历，我的本科院校到此为止都是我人生中过不去的坎，我羞于向任何人提起它，我想中国人都是有名校情结的，又或者说，世界上所有人其实都是无比尊重高学历的人才的。我记得读大一的那一年冬天，那是我在南京过的第一个冬天，南方来的孩子其实不那么能适应江苏湿冷的天气，仿佛整个城市都镀上了一层灰蒙蒙的水雾，看不清前路；我的父亲给我打过一个电话，在那样一个昏暗、寒冷的夜晚，他耳提面命的告诉我，我的人生只有读研这一条出路，去上一所传统意义的好学校，人生还有机会；这样傲慢的话语我独自承受了好多年，我的父亲是绝对的\"人才\"，在千军万马过独木桥的年代，他能获得数学、物理双科近满分的高考成绩，他对待我的成绩时总是带着不可置信，仿佛我哪怕遗传到他的万分之一也不至于如此。在那一天，我没有说出口的一句话是什么你知道吗？</p>\n<p>\"爸爸，我的人生只是因为没有一个好的成绩、没有一个华丽的学历，我就会完蛋吗？\"</p>\n<p>我是懦弱的，在面对可能出现的困境时，我下意识的会遵循一个已经给到我嘴边的答案路径。为了成为他的\"谈资\"、为了成为他的\"荣耀\"、为了成为他的\"骄傲\"，我按照他的设想去读了一所国外的名校。那两年好像我在家里也能挺直腰板，好像拥有了绝对的平等，好像获得了一定的自由，我甚至发自内心的觉得，我跟我本科的同学是不一样的，他们怎么能跟我比呢我可是毕业的时候挂在升学光荣榜上的人，我会拥有无比光明的未来，我会拥有无比灿烂的人生。</p>\n<p>真的吗？</p>\n<p>近三年我问过自己无数次。</p>\n<p>你知道一个非常可笑的事情，我已经工作三年了，我身边有许多经验比我老道的同事，他们拿着比我更高的薪水，顶着比我更高的头衔，干着比我更少的活，也拥有比我更不堪的学历。我想就是这样的瞬间我意识到了，读书真是好大的一场骗局。</p>\n<p>很多时候学历真的只是一个敲门砖而已，敲开门发现，里面真是五彩缤纷五光十色。我好像就开始释然了，也许还需要一些时间才能完全释然。但我想早晚有这一天，我想你也是。</p>\n<p>我想你说的成功是一种选择的资本，是一种自由，是一种完全掌握自己人生的自在感。这太难了。字里行间能感受到你是一个高度敏锐高度敏感的人，我也是。为此我进行了长达三年的心理咨询，在第一次咨询的时候咨询师问我想要达到什么样的目的，我说如果我可以钝一点就好了，不要对外界的事务有这么强的感知，不要对世界的一切有这么敏锐的感受，不要内耗不要多思多虑多想多看。时至今日我依然无法做到，我依然会为了一点微小的信号而焦虑到整夜睡不着觉，世间万物在我身边发生的第一秒我就想知道结果或者是走势，我要第一瞬间想到解决方案，我总想走在所有人、事、物之前，好像我提前想到了一切就能更自如的做出选择，做出反击，做出判断。很巧的，我读到了一本书，叫《悉达多》，在此我也想推荐给你。里面有一句话我至今都铭记于心，时时刻刻告诫自己：学会思考、学会等待、学会斋戒。我想这是可以对人生感到自在自由的根本，学会等待，等待发现周遭一切利于我的点为止。</p>\n<p>至于你说的自我提升和娱乐，这是人生亘古不变的永恒的难题。短视频的年代连感受都变得稍纵即逝，两秒钟无法抓住我的眼球我就会毫不犹豫的放弃继续阅读，到现在为止能支撑我的三观的好像还是高中时为了逃避乏味的理科作业读的那几本名著。我偶尔会强迫自己远离手机，但总是坚持不了多久。我想我完全无法提供任何切实可行的建议或引导，我想我们要一起去攻克这个名为自律的课题。</p>\n<p>我们之间的相似太多，而不相似的------我其实已经去过了很多地方。我曾经坐在悉尼的餐厅里看着寒冷冬日，一家四口出行，父母包裹得温温暖暖，而孩子穿着短袖短裤瑟缩，这在中国可是不常见的画面，我想这样很好，孩子早早的就知道了要为自己的选择付出代价，哪怕只是出门的时候穿了自己喜欢的短袖。我曾经坐在维也纳的金色大厅，看着头发花白的老人穿着考究，手挽着手安静的听一场古典乐的演奏，我想这种对于古典乐的文化底蕴不可多得，国人甚至不知道应该在哪个停顿给予一顿鼓掌才是对的。我曾经在罗马逛博物馆，他们允许盲人带着手套触摸名家雕塑，人类文明的华美在那一刻绽放在我眼前，其实盲人也没有与美绝缘。我说这些并不是想表达自己的优越或傲慢，我只是想说你看，回忆起旅行的时候人总是下意识的想起一些的触动，哪怕只是微小的细节，从他人的视角看到的世界是不真实的，你无法想象你在那个环境中会看到什么样的风景得到什么样的感悟，直到你真的站在那里为止。你所感受的世间百态会不会是一场巨大的信息茧房？我不敢细想，但我希望有一天你可以站在某个曾经无比向往的街头，然后发现原来这里不过如此，又在某个毫不在意的转角，得到了你受益终生的感受。答应我，不要停止对世界的探索，也不要纵容自己只是透过别人的眼睛看这个世界就感到无比知足，切实的，走上这条路。这是我能给你唯一的建议。</p>\n<p>人不会失败的，人只是在体验而已。希望有一天，你会找到热爱的工作，摄取向往的知识，走上探索的路，最重要的，希望有一天你会获得匹配你认知的能力和感受。</p>\n<p>期盼你的回信。</p>\n<p>以上。</p>\n<p>你的笔友</p>\n<p>Paula CHAN</p>\n</details>\n<details>\n<summary>\n零访问加密存储[19161700836@163.com](mailto:19161700836@163.com) ↔ [19161700836@163.com](mailto:19161700836@163.com)\n</summary>\n1208 [零访问加密存储19161700836@163.com](mailto:19161700836@163.com)\n<p>Luliy Cooper.<br>\n你好。看了许久，你这封信。却不知道该怎样去回答你。我并没有很高的学历，也并没有什么很大的神通。我很高兴你能跟我写这些，因为从此刻开始，我们之间已经有了一定的内心对白。你说人为什么会失败。我想我大概也只能说出人失败，最注重的或许只是那个过程呢，你在乎的结果也许它并不重要。所有事情他都只希望是能让你锻炼的，无非与成功与否。<br>\n在我眼中来看，什么事情或许在我眼中都不能够翻起波澜。或许在你眼中来看，什么事情都是带着悲伤色彩的，无论是即将毕业了，却找不到即将生活下去的奔头。高考失利了，没能考上三本，是自己的错。自己不会赚钱也是自己的错。为了逃避这些，试图用烟酒麻痹自己，让自己的身体导致的不健康，也是自己的错。或许在别人眼里而看，你已经彻底堕落，甚至已经放弃了自己。可是这又能有什么呢，无论对错与否，这些是你想要得来的吗。也许我可以一事无成，无事忙忙碌碌，但这不也挺好的吗？至少你还活在这世界上，至少你有一双眼睛，可以去看看这更大的世界，而不是困在这座小城里面。哪怕真的或许只能困在这座小城里面，那便用这双眼睛去更细致的看看这座小城里面的所有事物。<br>\n或许只是你现在还没有意识到自己现在到底是怎样的一个人。你所做的，你所那些逃避的事情，对于你现在来说，都已经过去了。即便你现在还是深陷在之前的所有事情里面，对于自己所做的那些耿耿于怀。放下这些事，或者说不再把这些事看作一个事。对自己说一声没关系。<br>\n没关系，这个词实在是太美好了。什么都没有关系，只有你这个人有关系。曾经的那些所有事都是没关系的，而现在你只需要保证你的当下，或者更长远一点，你的未来。<br>\n心中志气未消，难道不是对未来生活有了更好的开头吗。或许对于你来说，这点志气，只不过是深陷泥潭的自我挣扎罢了，永远也翻不起风浪。但在我看来应该不是。有些人忙忙碌碌的过了一生，都还没有找到自己到底想要的是什么。但你有的这份志气，或许便是你的有了这封信的开头。你不愿意这样子下去，你的这封信也许是想。倾诉，或者说找一个与自己一样的人相互诉说。但我想你也应该需要一份没有怎么见识过外面厉害的人的一份眼睛。在我眼中，这个世界是多么的庞大，它可以容纳无数人的东西。即使你说，你从未真正的踏入这个根本。可自人出生起，不都是已经踏入了根本吗。身上有了血缘，亲情，爱情，友情，甚至于对于路上路过的一个人，那一发，善心，随意投入的纸币，或者说买下的东西，没有用了，却也愿意将它送给身边的人，或者倒手倒手转卖了。让他拥有到更需要的人的手上。但是对于我来说，我现在的眼界不够大，不够宽广。连我也不知这\"根本\"到底要有什么的好奇呢，无穷无大。但对于我现在来说，好像也就只能这样去描述。<br>\n对于未来的恐惧，谁不会对未来恐惧呢。无论是谁，谁不会对未来感到恐惧呢。今年我的父亲生了一场重病，我对未来产生恐惧，如果我的父亲病不会好怎么办？那我未来该怎么办？我早就知道自己的学业不会多么出彩。便毅然决然的跑来了职校。怀着对未来的那份恐惧，我便更加坚定了，要走好自己现下的路。什么事情都有可以转换的余地，但现在来说，好像似乎也提起不了什么作用。曾经的事情，也只不过是让我对未来的恐惧而减轻一点。过去的事那便不提，即便我真的忘记不了。那便让它存在着吧，让我铭记，苦涩的记住它。对未来的恐惧，不会因为你当下做了什么不得了的事情而减轻。你只需要告诉你自己，无论什么时候做决定都不晚，只要你愿意去做，你的这份志气便是你对未来最好的应战。<br>\n太过浓厚厚重的想法。只是你对你自己的不信任而做的拖沓。那些乱七八糟的想法都可以先放下，自己好好的想一想。想不出来那也不更好了，那便依照着自己当下心里面怎么想的，那边怎么去做。对于未来太过遥远，而对于现在，那不仅是更好，珍惜现在，好好度过现在，而不是去荒废它。<br>\n而现在，你仍旧可以去学习，去阅读那些书，或者再次动身，去看看更辽阔的远方。或者不去更远的，只在这座小城里面走走，去看看自己曾经没有见过的，或者没有留意到的，或者走进现在所在的城市，去一间书房，不用多多广大。只随便走进一家让你舒心的，让你感到愉乐的，挑着一本自己看的书，来上自己一杯喜欢的水。度过一个下午。或许在有些人的眼中，这便是荒废时间，可我却不这么认为，这是在度过我自己喜欢的事。我在认认真真地感受着这个世界，感受着我曾经未曾见过的。<br>\n曾经我也就幻想着自己崭露头角。可现实呢，给了我狠狠的一击，我没有那么大的本领，也不喜欢去学习那些枯燥乏味的知识。可是幻想这种东西谁说得准呢？我不说，谁又知道我的幻想呢。沉浸在自己的幻想中，也许会让当下过得更糟糕。可是谁又不喜欢一颗蜜糖呢。能让自己过得舒心，过得如意。我也说不准，幻想到底好还是不好。沉迷于幻想，实在是太不过于现实。我总是用现实和幻想来对质。总是现实赢上一筹呢，可但我也不会就此放下幻想，我仍会幻想我是一名成绩好的人。人生如果没有了幻想，那便太可惜了。<br>\n无论如何，昨日的昨日都已经过去了，而今天的你却是崭新的你，因为今天的你也许有了新的想法，也许打游戏赢了一把，也许今天什么都没做，但已经却比昨日好了，因为今天的你是无法替代的你。每一日都是崭新的你，都是崭新的你我。昨日的那些事，由昨日的人记住吧，我已经在今天了。<br>\n话尽于此，我也不知该说什么了。我是一个眼界短浅的人。我说的这些话或许对你来说有用，没有用，但我也挺高兴我能写下这些话，思考了我过去从来没有思考过的问题。但无论如何，我还是写下了，对于你来说或许没有，但对于我来说，我已经跨过了很大的一步，找到了笔友。写下了自己曾经不敢写下的话。自己的内心想法也有了更好的去处。无论你是否在意这些话。我的这些话也会在我的人生中记录下很好的一笔。<br>\n看了全篇下来，我认为你是一个清醒，有着想改变自己的勇气，但却无从下手。就像是你知道自己对于线下的事情没有任何作用，然后呢就装睡试图以装睡来逃避这些问题，什么都不做。可你的那份志气却叫醒了你。或许来说，睡着了，便什么都不知道了，也不用面对这些问题，只有放任自己去麻木。可是你心中仍有那份志气，他催促着你写下这封信，向别人诉说着你的经历。我觉得这是一个很好的开头。即使真的做了什么也没有改变，但那也挺好的啊，至少我真的去做过了。至少我没有再继续装睡了，或许醒着要更痛苦一点，但是这些痛苦却不会为你带来什么，它只会让你更加清醒，让你选择接受这份生活。我觉得真正的改变不是你做了什么，而是你自己想清楚了什么。你想清楚了，然后你去做了，什么都没有改变，但是也没关系，因为你这个人已经知道了你真正想要的是什么了，那也无可厚非了，无论做什么不会改变，那便不改变了，你只要把你自己做得更好不就好了。<br>\n我的话迷迷糊糊的改了改了又改了。如果有错字，那便请担待了。这一大长篇写下来，便想着写完了，一定要好好奖励自己一番。我便是这么一个知足享乐的人，被困在当下，没有关系。总有一日会走出来，或者等到了某一个时刻，突然便想清楚了。当然对于我来说，或许什么都不做，顺其自然。什么也不要去改变他，我就是我就好了。我也被困在了当下呢，便只想着顺其自然，不愿意去做出改变，如此懒惰的一个人。<br>\n愿珍重。<br>\n用此信对你来说有用或者没用。可我也发出去了。希望你做出的改变是你想要的。<br>\n祝安好。</p>\n<p>我是1208 期待你的下次来信。</p>\n</details>\n<details>\n<summary>\n零访问加密存储[iantheforever@126.com](mailto:iantheforever@126.com) ↔ [iantheforever@126.com](mailto:iantheforever@126.com)\n</summary>\n[零访问加密存储iantheforever@126.com](mailto:iantheforever@126.com)\n芙心如\n<p>Luliy Cooper： 展信安！十分感谢你愿意将心底独白与我坦诚相告！<br>\n首先对过了三日才迟迟回信而抱歉，我很庆幸自己终于收到一封如此深刻的信件，也思索着怎么回复你。<br>\n通过你的文字，我所看到的你是思想深邃、与众不同的。我想我不该对你用道理说教，所以我先来聊聊我自己的成长历程吧。<br>\n今年我17岁，经历的时间并不算长，但自认为经历的事情和思考算是比同龄人要多。但想要和你同频可能还差点火候，所以我尽量去掉浮华，直述概要。\"芙心如\"这个网名，最初来源于我出生前曾祖父给我这个位置的孩子预留的名字演化而来。为什么提这个呢?我想这个名字蕴含着我一路上面对\"失败\"和调整\"心境\"的一些经验。<br>\n我自幼父母离异，没有体会过\"父母为情绪兜底\"之类的感受，作为家里头一个孩子，父亲和母亲也没有单独为我提供指导的经验，他们给予我的价值观是割裂的。于是我向外求，我14岁结识了此生来第一个如此知心的朋友，她有类似的家庭琐事，不同的是家里算是更加富裕。一年后她转学了，我所处的城市虽然也算得上繁华，但总有更好的选择。于是我们分别了，初期我用这个名字的前身给她写信，只是便于她在学校签收。当然，后来我们的关系也逐渐淡下来了。这是年幼的我面对的第一次失败------我丢了一位现在回想起来当时已经当做家人的朋友。我也焦虑，我也内耗，我整日幻想她未来与我无关的生活，整天丢了神，虽然不是什么大事，但也算是失败的。<br>\n这种状态一直到升入高中，中考发挥的不错，考上了一所还算可以的高中，进入学校之后能明显体会到周围人共同营造的氛围。在这种氛围下的感受是与众不同的，我开始融入他们。然而我深知我跟他们并不在同种道路上，我总抱着比他们要成熟的态度与他们交流沟通。渐渐的我也在自己心里为自己打造好了一个与众不同的人设：身边人刻苦学习我清楚，我刻苦与否暂且不论，但我觉得我的思想是要远超同龄人的，我比他们经历过多得多的家庭琐事和向内向外探求自我的历程。但这并不影响我平日里还是可以与他们同行。逐渐的我的社交面拓宽，向上我认识到了备考名校或是走国际路线的朋友，向下我也了解到了职高甚至高中辍学的同学们都在做什么。当然，社交面越广，越容易失掉本心，我不愿把自己的性格置于所处的任何一种环境中，于是我更专注于维护\"自己在自己心理的人设\"，说的好听的话，应该叫\"自我认知中的自我\"。于是\"芙心如\"所对应的那个名字又被用起来了------如今她代表着面向未来的、积极的我，遇到困苦时，想到\"自己也有完美无瑕的一面\"，会得到很多慰藉。<br>\n以上就是我想与你分享的一些经历。我想给你的建议大概有这三点：1.\"失败\"是对面对这件事时的自己而言的，与少年时的同伴分别当然会让一个14岁的小孩哭一阵子，耽误一段时间，但如今我意识到这件事后，我却感谢自己经历过这些，我才有学会怎么调整自己、甚至催生出未来要\"给自己树立好人设\"奠定基础。2.环境会影响人，但历经磨练不为环境所困的人才是各种环境中真正的成功者。\"环境\"影响\"心境\"，影响你的看法和情绪，不论是处在一所小城，还是一所自己并不满意的学校，这些环境当下当然会极力试图困住你，教你平庸，但\"明哲保身\"也并非不可。3.要记住自己积极的一面，不要总给自己贴负面标签。透过你的文字，我可以清晰的看到你有思考的一面，那么是什么使你不能将自己的思想正确指导实践呢?我用\"心力\"这个词来作为标准。\"心力\"一方面是与生俱来的，有些人生来擅长善始善终，有些人不会。另一方面，\"心力\"来源于自我的暗示和意志。绝大多数人都是趋向于享乐的，在这方面我很有感受，我也并不能好好引导自己远离游戏、浪费时间或是挥霍金钱。但当我意识到某件事确实重要时，我会试着告诉自己，作为一个未来要成长为一名为别人提供指导的人，以这样的心力是绝不能成功的，更配不上我的理想。<br>\n\"更好的人\"在于当下的每一步，向内做好自己的心理工作，成为自己大脑和身体的真正主人，向外正确认识到周围的一人一物，当然需要融入，但要记住自己与周围人是不同的。在外质上可以和几乎任何人结识，但在内质上一定不要受其干扰，保持纯净的心。<br>\n给你一个切实可行的小建议：多去往高能量人群聚集的地方。学期内我常去市一级的图书馆，今日我虽在社区图书馆回信，此地多是闲坐消遣的长辈，心绪烦闷时我并不会来。但市图书馆纪律规整，满室伏案沉淀的人，即便满心浮躁，只是静候片刻，自然也会心绪也会慢慢沉静的。除此之外，清晨或是晚间八九点的公园也是好去处，看阖家散步、好友闲谈，当然会觉得温馨，会切实感受到世间鲜活的美好，内心自然也就变得充实多了。<br>\n不必将我们定义为互为人师的关系，把我当作知心好友便可。若你偏爱其他相处节奏，也尽可告知。这是我初次给你回信，期待往后我们能常互通书信，畅谈心事。</p>\n<p>即候 文安 你的笔友 芙心如</p>\n</details>", "P15": "<p><a href=\"https://github.com/user-attachments/files/30794197/default.md\">发件人.md</a></p>", "P14": "<p>这个话题原本很大，但我真正想与您谈的，只是一件小事——我为什么会失败。之所以说它现实，是因为我几乎日日夜夜困于自我怀疑之中，心绪郁结，难以舒展。打下这些文字，是想借由梳理，看清自己的病灶，而后，或许能求得一线痊愈。若您恰好有类似的情况或者有不同的心病，可以与我交谈。这便是我写这封信的初衷。若没有也无妨，也可以与我交谈我的问题。</p>\n<p>首先，我为何不写自己因高考失利三本而失败？为何不写自己不会赚钱而失败？为何不写自己因嗜烟成瘾长期熬夜不注重自己健康而失败？偏偏选了\"心境\"这一隅来剖白，要知道，失败之对立面，是成功；而于我而言，成功从来不是财富或地位的堆叠，而是能最大限度的执掌自己的命运——所求即所得，日日心安，不为焦虑所困，不为内耗所噬，人生能循着自己所愿的方向，缓缓铺展。</p>\n<p>那么，我所愿的究竟是什么？金钱？康健？声名？我想，都不是。是内心的丰盈与从容，是对这个世界永不熄灭的好奇，是探索本身。是泰山崩于前面不改色的从容。世界浩瀚无垠，深不见底，有人穷尽一生，仅在一隅浅涉，便已令人叹服；而我，尚未曾真正踏入。我所愿探求的，是最根本、最原初的部分——竭尽心力，去追问那些于我而言至关重要的根本命题。只是，\"根本\"二字究竟所指为何，我至今仍未能想透，姑且按下，容后再叙。</p>\n<p>然而，怎样才能使内心丰盈、使日子过得安然？说来讽刺，此刻的我，某种意义上并不算不安逸——刷一段视频，玩一局游戏，看一部感官刺激的影像，点上一支烟，何其轻易的欢愉。可为何我仍郁郁难舒？因为我心中尚存一点志气，未曾熄灭。未曾欣赏世界的大好河山，我未曾遇见更广阔的人群，未曾与身边之人深谈过任何值得深谈的话题。我心中有话要说，却始终寻不到倾吐的出口。</p>\n<p>我对未来怀着深切的忧惧。学业将尽，前路未卜，我不知自己能做什么，该做什么。我能否甘之如饴地，去做一份自己钟爱的营生？纵使无法全然出于热爱，也盼能多积一些钱财，好让自己有余力去踏访更远的地方，结识更多的人，从容无惧地去丈量这个世界。</p>\n<p>那么，我为何未能成为一个更好的人？或许此刻，理应顺其自然，各安其分。我深知，心底始终盘桓着一种\"名校情结\"，不甘就此沉寂。读过的那些谈论自我成长的书籍，一再告诉我：我与旁人无异，亦有可为之处。我所欠缺的，不过是一件能够始终如一、持之以恒之事——是的，回想起来，我确实未曾真正坚持过什么。</p>\n<p>鲍老师说过，好好学习以应对考试，好好读书以应对人生。我想，我大抵是喜爱读书的，尽管常常三天打鱼、两天晒网。但书中那些我欲以言语道出却终究词不达意的心绪，在字里行间，竟能寻得知音，跃然纸上。我沉醉于那种心灵相击的震颤。是的，我热爱阅读，不仅想要丰盈自己，更想寻觅高山流水。近日听欧丽娟老师讲《红楼梦》，所获感悟——人生本无一套标准而确切的解法，所谓答案，唯有自己走出来。人须为自己的一切行为全权负责，不能再逃避了。人格之价值，须靠艰苦卓绝的努力方能成就，纵情放纵，绝无可能达至。</p>\n<p>然而，我仍无法在任何一件事上，真正做到心无旁骛。艰苦卓绝。视频与游戏之流，日复一日地攫取着我的专注，我无力与之抗衡。我的心智，是如此贫瘠，即便阅读《微习惯》，《原子习惯》，《聪明人的个人成长》等方面改变自身书籍，却总是不自觉地沦陷于那些浅薄而即时的欢愉之中——纵然明知那一刻转瞬即逝、了无意义，却仍甘之如饴。我没有能力将自己从这种欢愉中抽离。那些虚妄的片刻，填补着我孤独的裂隙，令我暂得其乐，深陷其中，难以自拔。</p>\n<p>我并非要指摘这些事物本身之不是，只是我未能在恰当的时机，以恰当的方式，去驾驭它们。日久天长，我竟已沉溺其中，不能自已。我是孤独的，却仍怀揣着有朝一日能崭露头角的幻梦——可现实是，我一次又一次，坠入这娱乐的泥沼，越陷越深。</p>\n<p>我生于一座的小城，内心孤僻，无友朋相聚之欢，无风物可寄情之美，唯余我一颗孤心，渴望去丈量这个广阔的世界。指尖滑动屏幕的刹那，世间百态尽收眼底，恍惚间，仿佛整个世界都为我所有；可转念，我又不甘平庸。待到一切归于沉寂，眼前只剩一地狼藉——悔恨昨日之我，厌弃今日之我，却仍妄图，拼尽全力去拯救那个尚未到来的、明日的我。</p>\n<p>匆匆数语，未及深思熟虑，还望见谅。此信权当剖白，亦盼你不吝赐教。</p>\n<p>即颂<br>\n文安</p>\n<p>你的笔友<br>\nLuliy Cooper.敬上</p>", "P13": "<p>{<br>\n\"years\": [\"2026\"],<br>\n\"categories\": [<br>\n{\"key\": \"travel\", \"label\": \"事件\"},<br>\n{\"key\": \"media\", \"label\": \"书视事\"},<br>\n{\"key\": \"posters\", \"label\": \"海报墙\"}<br>\n],<br>\n\"data\": {<br>\n\"2026\": {<br>\n\"travel\": [<br>\n{<br>\n\"month\": \"1月\",<br>\n\"city\": \"上海\",<br>\n\"items\": [<br>\n{\"title\": \"跨年烟花活动\"},<br>\n{\"title\": \"朋友聚会\"}<br>\n]<br>\n},<br>\n{<br>\n\"month\": \"3月\",<br>\n\"city\": \"杭州\",<br>\n\"items\": [<br>\n{\"title\": \"西湖春游\"},<br>\n{\"title\": \"参加读书分享会\", \"url\": \"https://example.com/reading-club\"}<br>\n]<br>\n},<br>\n{<br>\n\"month\": \"6月\",<br>\n\"city\": \"北京\",<br>\n\"items\": [<br>\n{\"title\": \"毕业典礼\"}<br>\n]<br>\n}<br>\n],<br>\n\"media\": [<br>\n{<br>\n\"month\": \"1月\",<br>\n\"books\": [\"百年孤独\", \"小王子\"],<br>\n\"watch\": [\"星际穿越\"],<br>\n\"shows\": [\"苹果发布会\"],<br>\n\"games\": [\"线上编程训练营\"]<br>\n},<br>\n{<br>\n\"month\": \"4月\",<br>\n\"books\": [\"人类简史\"],<br>\n\"watch\": [\"奥本海默\", \"沙丘2\"],<br>\n\"shows\": [],<br>\n\"games\": [{\"title\": \"TED演讲：AI的未来\", \"url\": \"https://example.com/ted-ai\"}]<br>\n},<br>\n{<br>\n\"month\": \"8月\",<br>\n\"books\": [],<br>\n\"watch\": [\"瞬息全宇宙\"],<br>\n\"shows\": [\"巴黎奥运会\"],<br>\n\"games\": [\"参加马拉松训练营\"]<br>\n}<br>\n],<br>\n\"posters\": [<br>\n{<br>\n\"image\": \"https://picsum.photos/seed/poster1/600/800\",<br>\n\"title\": \"春日随笔\"<br>\n},<br>\n{<br>\n\"image\": \"https://picsum.photos/seed/poster2/600/800\",<br>\n\"title\": \"旅行手记 · 杭州\",<br>\n\"url\": \"https://example.com/hangzhou-trip\"<br>\n},<br>\n{<br>\n\"image\": \"https://picsum.photos/seed/poster3/600/800\",<br>\n\"title\": \"年度总结海报\"<br>\n}<br>\n]<br>\n}<br>\n}<br>\n}</p>", "P12": "<h1>1</h1>\n<p>大声的</p>\n<h2>2</h2>\n<p>大师按时</p>\n<h3>3</h3>\n<p>大三大四das</p>\n<h4>4</h4>\n<p>安师大撒旦</p>\n<h5>5</h5>\n<p>按时大三大四</p>\n<h6>6</h6>\n<p>敖德萨撒旦</p>", "P7": "<h1>ΔιάΝους 博客完整说明指南</h1>\n<h2>一、5 分钟快速搭建 Gmeek 博客</h2>\n<p>Gmeek 是一个「用 GitHub Issues 写博客」的框架，文章就是 Issue，发布靠 GitHub Actions 自动生成静态页。</p>\n<p><strong>步骤：</strong></p>\n<ol>\n<li><strong>Fork 或新建仓库</strong>：仓库名建议用 <code class=\"notranslate\">你的用户名.github.io</code>（这样可以用根域名）。</li>\n<li><strong>启用 GitHub Pages</strong>：仓库 Settings → Pages → Source 选 <code class=\"notranslate\">GitHub Actions</code>。</li>\n<li><strong>放入 Gmeek 配置</strong>：仓库根目录要有 <code class=\"notranslate\">config.json</code>（站点配置）和 <code class=\"notranslate\">.github/workflows/</code> 里的工作流文件。</li>\n<li><strong>写文章 = 发 Issue</strong>：在仓库 Issues 里新建 Issue，标题是文章标题，正文是 Markdown 内容，打上你想要的分类标签。</li>\n<li><strong>触发生成</strong>：Gmeek 的 GitHub Action 会自动把 Issue 转成网页。</li>\n<li><strong>访问</strong>：<code class=\"notranslate\">https://你的用户名.github.io</code> 就能看到。</li>\n</ol>\n<blockquote>\n<p>核心概念：<strong>一篇文章 = 一个 Issue</strong>，<strong>一个标签 = 一个分类</strong>。你不用碰 HTML，写 Markdown 就行。</p>\n</blockquote>\n<hr>\n<h2>二、CSS 和 JS 在 Gmeek 里怎么配置</h2>\n<p>Gmeek 的 <code class=\"notranslate\">config.json</code> 里有几个字段专门用来注入自定义样式和脚本：</p>\n<markdown-accessiblity-table><table role=\"table\">\n<thead>\n<tr>\n<th>字段</th>\n<th>作用</th>\n<th>在哪个页面生效</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><code class=\"notranslate\">allHead</code></td>\n<td>注入到所有页面 <code class=\"notranslate\">&lt;head&gt;</code> 的内容（引入 CSS/JS 文件、字体、第三方库）</td>\n<td>全部页面</td>\n</tr>\n<tr>\n<td><code class=\"notranslate\">style</code></td>\n<td>全站 CSS（直接写样式代码）</td>\n<td>全部页面</td>\n</tr>\n<tr>\n<td><code class=\"notranslate\">script</code></td>\n<td>全站 JS（直接写脚本代码）</td>\n<td>全部页面</td>\n</tr>\n<tr>\n<td><code class=\"notranslate\">indexStyle</code></td>\n<td>仅首页 CSS</td>\n<td>仅首页</td>\n</tr>\n<tr>\n<td><code class=\"notranslate\">indexScript</code></td>\n<td>仅首页 JS</td>\n<td>仅首页</td>\n</tr>\n<tr>\n<td><code class=\"notranslate\">head</code></td>\n<td>注入到 <code class=\"notranslate\">&lt;head&gt;</code> 最前面（适合放要尽早执行的脚本，比如防闪烁）</td>\n<td>全部页面</td>\n</tr>\n</tbody>\n</table></markdown-accessiblity-table>\n<h3>本博客的做法（推荐）</h3>\n<p>把大量的自定义代码<strong>单独存成文件</strong>，而不是全塞进 <code class=\"notranslate\">config.json</code>（否则 JSON 会变得巨大、难维护）：</p>\n<ol>\n<li>在仓库 <code class=\"notranslate\">docs/</code> 目录放两个文件：<code class=\"notranslate\">enhance.css</code> 和 <code class=\"notranslate\">enhance.js</code></li>\n<li>在 <code class=\"notranslate\">config.json</code> 的 <code class=\"notranslate\">allHead</code> 末尾用 <code class=\"notranslate\">&lt;link&gt;</code> 和 <code class=\"notranslate\">&lt;script&gt;</code> 引入它们：</li>\n</ol>\n<div class=\"highlight highlight-text-html-basic\"><pre class=\"notranslate\"><span class=\"pl-kos\">&lt;</span><span class=\"pl-ent\">link</span> <span class=\"pl-c1\">rel</span>='<span class=\"pl-s\">stylesheet</span>' <span class=\"pl-c1\">href</span>='<span class=\"pl-s\">/enhance.css</span>'<span class=\"pl-kos\">&gt;</span>\n<span class=\"pl-kos\">&lt;</span><span class=\"pl-ent\">script</span> <span class=\"pl-c1\">defer</span> <span class=\"pl-c1\">src</span>='<span class=\"pl-s\">/enhance.js</span>'<span class=\"pl-kos\">&gt;</span><span class=\"pl-kos\">&lt;/</span><span class=\"pl-ent\">script</span><span class=\"pl-kos\">&gt;</span></pre></div>\n<p>这样以后改样式/功能，只动 <code class=\"notranslate\">enhance.css</code> / <code class=\"notranslate\">enhance.js</code> 两个文件，<code class=\"notranslate\">config.json</code> 基本不用动。</p>\n<blockquote>\n<p>本博客的 <code class=\"notranslate\">allHead</code> 里还引入了：KaTeX（数学公式）、Prism（代码高亮）、Mermaid（流程图）、Chart.js（图表）、APlayer（音乐播放器）、Live2D（看板娘）等第三方库。</p>\n</blockquote>\n<h3>head 字段的防闪烁脚本</h3>\n<p><code class=\"notranslate\">head</code> 字段里放了一段<strong>很早执行</strong>的脚本，作用是在页面刚加载、CSS 还没生效时就确定深色/浅色模式，避免「先白屏一下再变暗」的闪烁。这类需要抢在渲染前执行的代码就放 <code class=\"notranslate\">head</code>。</p>\n<hr>\n<h2>三、功能总目录</h2>\n<h3>✅ 已实现的功能</h3>\n<markdown-accessiblity-table><table role=\"table\">\n<thead>\n<tr>\n<th>序号</th>\n<th>英文名</th>\n<th>中文名</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>00</td>\n<td>Loading Splash</td>\n<td>加载动画（两种随机：流光 / 光线扫描）</td>\n</tr>\n<tr>\n<td>01</td>\n<td>localStorage Init</td>\n<td>本地设置初始化</td>\n</tr>\n<tr>\n<td>02</td>\n<td>Progress Bar</td>\n<td>阅读进度条</td>\n</tr>\n<tr>\n<td>03</td>\n<td>Dynamic Title</td>\n<td>动态标题（切走标签页时变化）</td>\n</tr>\n<tr>\n<td>04</td>\n<td>Uptime Counter</td>\n<td>建站运行时长计时</td>\n</tr>\n<tr>\n<td>05</td>\n<td>Dark-mode Ripple</td>\n<td>深浅模式切换涟漪动画</td>\n</tr>\n<tr>\n<td>06</td>\n<td>Cyber Particles</td>\n<td>赛博粒子背景（经典 / 城市天际线两种风格）</td>\n</tr>\n<tr>\n<td>07</td>\n<td>Web Audio SFX</td>\n<td>交互音效</td>\n</tr>\n<tr>\n<td>08</td>\n<td>Click Sparks</td>\n<td>点击火花 / 鼠标拖尾</td>\n</tr>\n<tr>\n<td>09</td>\n<td>Navbar</td>\n<td>顶部导航（头像 + 站名 + 时钟 + 图标）</td>\n</tr>\n<tr>\n<td>10</td>\n<td>Brand + Thinker Icon</td>\n<td>站名发光标题 + 沉思者图标（跳 Issues）</td>\n</tr>\n<tr>\n<td>11</td>\n<td>Subtitle Links</td>\n<td>副标题三词链接（→ Chronicle / Book / Favorites）</td>\n</tr>\n<tr>\n<td>12</td>\n<td>Image Lightbox</td>\n<td>图片灯箱（点击放大）</td>\n</tr>\n<tr>\n<td>13</td>\n<td>Floating Toolbar</td>\n<td>浮动设置面板（主题 / 阅读偏好 / 音乐 / 特效开关）</td>\n</tr>\n<tr>\n<td>13a</td>\n<td>7 Themes</td>\n<td>七套主题（赛博朋克 / 默认 / 樱花 / 你的名字 / 太空 / 日落 / 单色）</td>\n</tr>\n<tr>\n<td>13b</td>\n<td>Liquid Glass</td>\n<td>液态玻璃（模糊 / 透明度 / 色调可调）</td>\n</tr>\n<tr>\n<td>14</td>\n<td>Home Category Cards</td>\n<td>首页六张分类卡片（宽高可调 + 悬停霓虹光晕）</td>\n</tr>\n<tr>\n<td>15</td>\n<td>macOS Code Block</td>\n<td>代码块美化（三个圆点 + 行号）</td>\n</tr>\n<tr>\n<td>16</td>\n<td>Sakura</td>\n<td>樱花花瓣飘落</td>\n</tr>\n<tr>\n<td>17</td>\n<td>Reading Progress Ring</td>\n<td>阅读进度环 + 返回顶部</td>\n</tr>\n<tr>\n<td>18</td>\n<td>Nav Drawer</td>\n<td>抽屉式侧边导航（汉堡菜单）</td>\n</tr>\n<tr>\n<td>19</td>\n<td>Favorites Lock</td>\n<td>收藏页密码锁</td>\n</tr>\n<tr>\n<td>21</td>\n<td>Post Page</td>\n<td>文章页（系列导航 + 滚动记忆 + 站内搜索）</td>\n</tr>\n<tr>\n<td>23</td>\n<td>Tag Cloud</td>\n<td>标签云页</td>\n</tr>\n<tr>\n<td>24</td>\n<td>In-page Search</td>\n<td>文章内搜索浮层</td>\n</tr>\n<tr>\n<td>25</td>\n<td>Mouse Trail</td>\n<td>鼠标拖尾 + 萤火虫</td>\n</tr>\n<tr>\n<td>26</td>\n<td>View Transitions</td>\n<td>跨页淡入淡出过渡</td>\n</tr>\n<tr>\n<td>A</td>\n<td>Archives</td>\n<td>归档页（Weekly / Other 双标签 + 分页）</td>\n</tr>\n<tr>\n<td>C</td>\n<td>Chronicle</td>\n<td>编年史页（年份 + 出游 / 书影游 / 海报墙）</td>\n</tr>\n<tr>\n<td>B</td>\n<td>Bookshelf</td>\n<td>书架页（自动读 Library 文章，五大类）</td>\n</tr>\n<tr>\n<td>M</td>\n<td>APlayer</td>\n<td>可拖动音乐播放器（增删曲 / 随机 / 快捷键）</td>\n</tr>\n</tbody>\n</table></markdown-accessiblity-table>\n<h3>⬜ 尚未实现 / 已移除的功能</h3>\n<markdown-accessiblity-table><table role=\"table\">\n<thead>\n<tr>\n<th>名称</th>\n<th>说明</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Hero Banner</td>\n<td>旧的首页大横幅，已移除（改用六张分类卡片）</td>\n</tr>\n<tr>\n<td>Background Image</td>\n<td>背景图功能已移除（全站改用纯色 + 粒子）</td>\n</tr>\n<tr>\n<td>Mouse Glow Halo</td>\n<td>鼠标光晕，已删除（保留拖尾和点击爆炸）</td>\n</tr>\n<tr>\n<td>Reading Summary</td>\n<td>Chronicle/Book 暂不显示文章摘要（postList.json 无摘要字段）</td>\n</tr>\n<tr>\n<td>Gallery Banner</td>\n<td>首页底部画廊横幅，已停用</td>\n</tr>\n</tbody>\n</table></markdown-accessiblity-table>\n<hr>\n<h2>四、功能详解（按序号）</h2>\n<blockquote>\n<p>以下按代码里的区块序号介绍核心功能，方便你日后定位修改。</p>\n</blockquote>\n<p><strong>00 加载动画 Loading Splash</strong><br>\n打开网站时居中显示「ΔιάΝους」。两种动画随机出现：① 流光（霓虹色缠绕流动）；② 光线扫描（白光从左扫到右，扫到的字母才亮，结尾十字星闪烁）。约 1.5 秒后淡出。</p>\n<p><strong>01 本地设置初始化 localStorage Init</strong><br>\n所有用户偏好（主题、特效开关、音乐位置等）存在浏览器 localStorage 里，键名都以 <code class=\"notranslate\">luliy-</code> 开头。手机端默认关闭粒子和樱花（纯净阅读）。</p>\n<p><strong>02–04 进度条 / 动态标题 / 运行时长</strong><br>\n顶部阅读进度条；切走标签页时标题变化提醒；页脚显示建站至今的运行天数。</p>\n<p><strong>05 深浅模式涟漪 Dark-mode Ripple</strong><br>\n切换深浅模式时，从点击位置扩散一圈涟漪动画。</p>\n<p><strong>06 赛博粒子 Cyber Particles</strong><br>\n全屏粒子背景，两种风格：① 经典（粒子向站名汇聚）；② 城市（多层 3D 赛博朋克建筑天际线 + 物理引力粒子）。在设置面板可切换、可关闭。那些紫色的星星就是这个系统。</p>\n<p><strong>07–08 音效 / 点击火花</strong><br>\n交互音效（Web Audio 合成）；点击迸发火花、鼠标拖尾粒子。</p>\n<p><strong>09–11 导航 / 站名 / 副标题</strong><br>\n顶部：头像、站名、时钟、图标按钮。站名「ΔιάΝους」有恒星核心发光效果，右边是 Q 版沉思者图标（点击进 GitHub Issues）。副标题三个希腊词分别链接到 Chronicle / Book / Favorites。</p>\n<p><strong>12 图片灯箱 Image Lightbox</strong><br>\n文章里的图片点击可放大查看。</p>\n<p><strong>13 浮动设置面板 Floating Toolbar</strong><br>\n核心控制台。可切换：七套主题、液态玻璃参数（模糊/透明度/色调）、文章面板透明度、卡片宽高、粒子开关与风格、樱花开关、减弱动效、卡片视图。有「恢复默认值」按钮。这些设置也镜像在抽屉里。</p>\n<p><strong>14 首页分类卡片 Home Category Cards</strong><br>\n首页六张卡片：学习 / 日志 / 随笔 / 指南 / 藏书 / AI，对应 GitHub 标签。卡片宽高可在设置里调，悬停时上浮 + 粉色霓虹光晕 + 图片放大锐化。</p>\n<p><strong>15–17 代码块 / 樱花 / 阅读进度环</strong><br>\n代码块仿 macOS 窗口（三个圆点 + 行号）；樱花花瓣飘落；文章页右下角阅读进度环 + 返回顶部。</p>\n<p><strong>18 抽屉导航 Nav Drawer</strong><br>\n左上角汉堡菜单展开侧边抽屉，含快捷链接、主题切换、设置。抽屉背景跟随当前主题变色。</p>\n<p><strong>19 收藏页密码锁 Favorites Lock</strong><br>\n收藏页用前端密码遮挡（注意：仅是遮挡，源码里仍可见，别放真正机密）。</p>\n<p><strong>21–26 文章页 / 标签云 / 搜索 / 拖尾 / 过渡</strong><br>\n文章页支持系列导航、滚动位置记忆、站内搜索；标签云页；文章内搜索浮层；鼠标拖尾萤火虫；跨页淡入淡出。</p>\n<p><strong>A / C / B / M：见下方专章和书架说明。</strong></p>\n<hr>\n<h2>五、Archives 归档页 怎么用</h2>\n<p><strong>它是什么</strong>：把你所有文章按时间归档展示的页面，URL 是 <code class=\"notranslate\">/archive.html</code>。</p>\n<p><strong>页面长什么样</strong>：</p>\n<ul>\n<li>右上角有「Weekly | Other」两个标签</li>\n<li>文章按年份分组，每行左边日期、右边标题</li>\n<li>每页 10 篇，超过自动分页（&lt; Page 1 of N &gt;）</li>\n<li>会记住你上次看的是哪个标签</li>\n</ul>\n<p><strong>两个标签怎么分</strong>：</p>\n<ul>\n<li><strong>Weekly</strong>：文章标签里有 <code class=\"notranslate\">Weekly</code> / <code class=\"notranslate\">周记</code> / <code class=\"notranslate\">周报</code> / <code class=\"notranslate\">二十四节气</code> 任意一个</li>\n<li><strong>Other</strong>：其余正常文章（系统页如 about/book 等会被自动排除）</li>\n</ul>\n<p><strong>怎么维护</strong>：完全自动。你正常发文章（带标签），归档页就自动更新，不用手动列清单。</p>\n<p><strong>怎么创建这个页面</strong>：</p>\n<ol>\n<li><code class=\"notranslate\">config.json</code> 的 <code class=\"notranslate\">singlePage</code> 里要有 <code class=\"notranslate\">archive</code></li>\n<li>建一个 Issue：标题随意、标签 <code class=\"notranslate\">archive</code>、正文写一句占位即可</li>\n</ol>\n<hr>\n<h2>六、Chronicle 编年史页 怎么用</h2>\n<p><strong>它是什么</strong>：记录你的年度生活轨迹的页面，URL 是 <code class=\"notranslate\">/chronicle.html</code>。分三个板块：出游、书影游、海报墙。</p>\n<p><strong>页面长什么样</strong>：</p>\n<ul>\n<li>右上角切换年份（2026 / 2025...）</li>\n<li>下面切换板块：出游 / 书影游 / 海报墙</li>\n<li>出游：月份 | 城市 | 活动（同月份自动合并）</li>\n<li>书影游：月份 | 读书 | 观影 | 演出 | 游戏</li>\n<li>海报墙：网格图片，点击全屏看大图，可左右切换</li>\n<li>会记住你上次选的年份和板块</li>\n</ul>\n<p><strong>数据从哪来</strong>：和归档页不同，编年史内容<strong>不是从文章自动生成</strong>的，而是来自一个专门的 GitHub Issue（标签 <code class=\"notranslate\">chronicle-data</code>）。你编辑那个 Issue 的内容，刷新页面就更新（不用重新生成站点）。</p>\n<p><strong>怎么用（三个 Issue）</strong>：</p>\n<markdown-accessiblity-table><table role=\"table\">\n<thead>\n<tr>\n<th>Issue</th>\n<th>标题</th>\n<th>标签</th>\n<th>正文</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>页面</td>\n<td>Chronicle</td>\n<td><code class=\"notranslate\">chronicle</code></td>\n<td>一段固定的占位骨架（含备用数据）</td>\n</tr>\n<tr>\n<td>数据</td>\n<td>随意</td>\n<td><code class=\"notranslate\">chronicle-data</code></td>\n<td>你的实际内容（JSON 格式，夹在两行注释中间）</td>\n</tr>\n</tbody>\n</table></markdown-accessiblity-table>\n<p>数据 Issue 正文格式：</p>\n<pre class=\"notranslate\"><code class=\"notranslate\">&lt;!-- chronicle:data:start --&gt;\n{ ...你的 JSON 数据... }\n&lt;!-- chronicle:data:end --&gt;\n</code></pre>\n<p><strong>JSON 结构要点</strong>：</p>\n<ul>\n<li><code class=\"notranslate\">years</code>：年份数组，如 <code class=\"notranslate\">[\"2026\",\"2025\"]</code>，第一个默认显示</li>\n<li><code class=\"notranslate\">categories</code>：三个板块，<code class=\"notranslate\">key</code> 必须是 <code class=\"notranslate\">travel</code>/<code class=\"notranslate\">media</code>/<code class=\"notranslate\">posters</code>（不能改），<code class=\"notranslate\">label</code> 是显示名（可改）</li>\n<li><code class=\"notranslate\">data</code>：每年每个板块的具体内容</li>\n</ul>\n<p><strong>最容易出错的地方</strong>：JSON 里必须用英文双引号，不能有多余逗号，年份要写成字符串。改完建议先到 jsonlint.com 验证一下再贴。</p>\n<hr>\n<h2>七、除了复制粘贴代码，你还需要配置什么</h2>\n<p>除了把 <code class=\"notranslate\">enhance.js</code> / <code class=\"notranslate\">enhance.css</code> 放进 <code class=\"notranslate\">docs/</code>，你还需要在 <strong>config.json</strong> 里确认/配置这些（全中文说明）：</p>\n<h3>1. 必填的基础信息</h3>\n<markdown-accessiblity-table><table role=\"table\">\n<thead>\n<tr>\n<th>字段</th>\n<th>填什么</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><code class=\"notranslate\">title</code> / <code class=\"notranslate\">displayTitle</code></td>\n<td>站点名称（你的是 ΔιάΝους）</td>\n</tr>\n<tr>\n<td><code class=\"notranslate\">subTitle</code></td>\n<td>副标题文字</td>\n</tr>\n<tr>\n<td><code class=\"notranslate\">avatarUrl</code></td>\n<td>头像图片链接</td>\n</tr>\n<tr>\n<td><code class=\"notranslate\">homeUrl</code></td>\n<td>你的网站域名（如 <a href=\"https://luliy.me%EF%BC%89\" rel=\"nofollow\">https://luliy.me）</a></td>\n</tr>\n<tr>\n<td><code class=\"notranslate\">email</code></td>\n<td>联系邮箱</td>\n</tr>\n<tr>\n<td><code class=\"notranslate\">startSite</code></td>\n<td>建站日期（用于运行时长计时）</td>\n</tr>\n</tbody>\n</table></markdown-accessiblity-table>\n<h3>2. singlePage（单页列表）</h3>\n<p>要让 Archives / Chronicle / Book 这些特殊页面生效，它们的名字必须列在这里：</p>\n<div class=\"highlight highlight-source-json\"><pre class=\"notranslate\"><span class=\"pl-ent\">\"singlePage\"</span>: [<span class=\"pl-s\"><span class=\"pl-pds\">\"</span>about<span class=\"pl-pds\">\"</span></span>,<span class=\"pl-s\"><span class=\"pl-pds\">\"</span>gallery<span class=\"pl-pds\">\"</span></span>,<span class=\"pl-s\"><span class=\"pl-pds\">\"</span>book<span class=\"pl-pds\">\"</span></span>,<span class=\"pl-s\"><span class=\"pl-pds\">\"</span>favorites<span class=\"pl-pds\">\"</span></span>,<span class=\"pl-s\"><span class=\"pl-pds\">\"</span>archive<span class=\"pl-pds\">\"</span></span>,<span class=\"pl-s\"><span class=\"pl-pds\">\"</span>stock<span class=\"pl-pds\">\"</span></span>,<span class=\"pl-s\"><span class=\"pl-pds\">\"</span>link<span class=\"pl-pds\">\"</span></span>,<span class=\"pl-s\"><span class=\"pl-pds\">\"</span>chronicle<span class=\"pl-pds\">\"</span></span>]</pre></div>\n<h3>3. allHead（引入文件和库）</h3>\n<p>确认末尾有引入你的两个文件：</p>\n<div class=\"highlight highlight-text-html-basic\"><pre class=\"notranslate\"><span class=\"pl-kos\">&lt;</span><span class=\"pl-ent\">link</span> <span class=\"pl-c1\">rel</span>='<span class=\"pl-s\">stylesheet</span>' <span class=\"pl-c1\">href</span>='<span class=\"pl-s\">/enhance.css</span>'<span class=\"pl-kos\">&gt;</span>\n<span class=\"pl-kos\">&lt;</span><span class=\"pl-ent\">script</span> <span class=\"pl-c1\">defer</span> <span class=\"pl-c1\">src</span>='<span class=\"pl-s\">/enhance.js</span>'<span class=\"pl-kos\">&gt;</span><span class=\"pl-kos\">&lt;/</span><span class=\"pl-ent\">script</span><span class=\"pl-kos\">&gt;</span></pre></div>\n<h3>4. 要建的 Issues（页面和数据）</h3>\n<markdown-accessiblity-table><table role=\"table\">\n<thead>\n<tr>\n<th>用途</th>\n<th>标签</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>归档页</td>\n<td><code class=\"notranslate\">archive</code></td>\n</tr>\n<tr>\n<td>编年史页</td>\n<td><code class=\"notranslate\">chronicle</code></td>\n</tr>\n<tr>\n<td>编年史数据</td>\n<td><code class=\"notranslate\">chronicle-data</code></td>\n</tr>\n<tr>\n<td>书架页</td>\n<td><code class=\"notranslate\">book</code></td>\n</tr>\n<tr>\n<td>关于页</td>\n<td><code class=\"notranslate\">about</code></td>\n</tr>\n<tr>\n<td>收藏页</td>\n<td><code class=\"notranslate\">favorites</   applyClips(p.id); tocSpy();
}
document.addEventListener('click', e => {
  const a = e.target.closest('#rBody .anc');
  if (a) { const link = location.href.split('#')[0] + '#' + curId + '-' + a.dataset.h; history.replaceState(null, '', '#' + curId + '-' + a.dataset.h); copyText(link, '已複製這一節的連結'); return; }
  const c = e.target.closest('#rBody .codebox .cp');
  if (c) { copyText(c.parentElement.querySelector('pre').textContent, '已複製程式碼'); return; }
  const img = e.target.closest('#rBody img');
  if (img && !img.closest('a')) { const z = $('#zoom'); z.querySelector('img').src = img.currentSrc || img.src; z.querySelector('img').alt = img.alt; z.hidden = false; }
});
$('#zoom').addEventListener('click', () => { $('#zoom').hidden = true; });
document.addEventListener('click', e => { const a = e.target.closest('#rToc a[data-h]'); if (!a) return; e.preventDefault(); const h = document.getElementById(a.dataset.h); if (h) h.scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' }); });
function tocSpy() {
  if ($('#reader').hidden) return;
  const b = $('#rBody'); if (!b) return;
  const r = b.getBoundingClientRect(), total = r.height - innerHeight * .5, pc = total > 0 ? Math.min(1, Math.max(0, -r.top / total)) : 1;
  $('#prog i').style.width = (pc * 100) + '%';
  if (curId && !resuming && b.textContent.trim().length > 20) { const g = prog[curId] || {}; g.r = pc; if (pc >= .97) g.d = 1; g.t = Date.now(); prog[curId] = g; clearTimeout(tocSpy.t); tocSpy.t = setTimeout(() => { try { localStorage.setItem('v-progress', JSON.stringify(prog)); } catch (e) {} }, 400); }
  const as = [...document.querySelectorAll('#rToc a[data-h]')]; let on = null;
  as.forEach(a => { const h = document.getElementById(a.dataset.h); if (h && h.getBoundingClientRect().top < 130) on = a; });
  as.forEach(a => a.classList.toggle('on', a === on));
}
addEventListener('scroll', tocSpy, { passive: true });
/* Kindle: open where you stopped */
function resume(p) {
  const g = prog[p.id]; if (!g || g.d || !(g.r > .03 && g.r < .97)) { setTimeout(() => { resuming = false; }, 50); return; }
  requestAnimationFrame(() => {
    const b = $('#rBody'); if (!b) { resuming = false; return; }
    const top = b.getBoundingClientRect().top + scrollY, total = b.offsetHeight - innerHeight * .5;
    scrollTo(0, Math.max(0, top + g.r * total)); toast('從上次的位置繼續 · ' + Math.round(g.r * 100) + '%');
    setTimeout(() => { resuming = false; }, 300);
  });
}
/* comments: Blog B's own utterances thread on this Issue, loaded only when asked for */
function comments(p) {
  const btn = $('#cmBtn'), box = $('#cmBox'); const open = box.hidden;
  box.hidden = !open; btn.setAttribute('aria-expanded', String(open)); btn.querySelector('span').textContent = open ? '▲' : '▼';
  if (!open || box.dataset.loaded) return;
  box.dataset.loaded = '1';
  box.innerHTML = '<p class="note2">正在載入評論……</p>';
  const dark = document.documentElement.dataset.theme === 'dark' || (!document.documentElement.dataset.theme && matchMedia('(prefers-color-scheme: dark)').matches);
  const sc = document.createElement('script');
  sc.src = 'https://utteranc.es/client.js'; sc.async = true; sc.crossOrigin = 'anonymous';
  sc.setAttribute('repo', 'luliyer6-ux/luliyer6-ux.github.io'); sc.setAttribute('issue-number', p.id.slice(1)); sc.setAttribute('theme', dark ? 'github-dark' : 'github-light');
  box.append(sc);
  setTimeout(() => { if (!box.querySelector('iframe')) box.innerHTML = `<p class="note2">評論區載入不了（可能是網路連不到 GitHub）。可以直接<a href="${GH}/issues/${p.id.slice(1)}" target="_blank" rel="noopener noreferrer">到 GitHub 這篇的頁面留言 ↗</a>。</p>`; else box.querySelector('.note2') && box.querySelector('.note2').remove(); }, 8000);
}
function themeComments() { const f = document.querySelector('.utterances-frame'); if (!f) return; const dark = document.documentElement.dataset.theme === 'dark' || (!document.documentElement.dataset.theme && matchMedia('(prefers-color-scheme: dark)').matches); try { f.contentWindow.postMessage({ type: 'set-theme', theme: dark ? 'github-dark' : 'github-light' }, 'https://utteranc.es'); } catch (e) {} }
function route() {
  const h = (location.hash || '').slice(1), m = /^(P\d+)(?:-(h-\d+))?$/.exec(h);
  const p = m && posts.concat(all).find(x => x.id === m[1]);
  const view = p ? 'reader' : h === 'about' ? 'about' : h ? 'nf' : 'home';
  if (view !== 'home' && !$('#home').hidden) homeY = scrollY;
  ['home', 'reader', 'about', 'nf'].forEach(v => { $('#' + v).hidden = v !== view; });
  $('#rbar').hidden = view !== 'reader'; $('#prog').hidden = view !== 'reader'; $('#zoom').hidden = true;
  if (view === 'reader') {
    openReader(p);
    if (m[2]) setTimeout(() => { const t = document.getElementById(m[2]); if (t) { resuming = false; t.scrollIntoView(); } }, 60);
  } else {
    curId = '';
    document.title = view === 'about' ? '關於 · ΔιάΝους' : view === 'nf' ? '找不到這一頁 · ΔιάΝους' : 'ΔιάΝους';
    if (view === 'home') { render(); scrollTo(0, homeY); } else scrollTo(0, 0);
  }
}
$('#randomPost').addEventListener('click', e => { e.preventDefault(); const p = posts[Math.floor(Math.random() * posts.length)]; if (p) location.hash = p.id; });
addEventListener('hashchange', route);

/* ---------- clippings ---------- */
let clips = [];
try { clips = JSON.parse(localStorage.getItem('v-clips') || '[]'); } catch (e) {}
const saveClips = () => { try { localStorage.setItem('v-clips', JSON.stringify(clips)); } catch (e) {} $('#clipN').textContent = clips.length; };
saveClips();
let toastT; const toast = m => { const t = $('#toast'); t.textContent = m; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; }, 1800); };
const copyText = (text, ok) => { const done = () => toast(ok); if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, () => fb()); else fb(); function fb() { const a = document.createElement('textarea'); a.value = text; a.style.cssText = 'position:fixed;opacity:0'; document.body.append(a); a.select(); try { document.execCommand('copy'); done(); } catch (e) { toast('請手動複製'); } a.remove(); } };
function wrap(b, text, id) {
  const w = document.createTreeWalker(b, NodeFilter.SHOW_TEXT); let n;
  while ((n = w.nextNode())) { const i = n.data.indexOf(text); if (i < 0 || n.parentElement.closest('mark')) continue; const r = document.createRange(); r.setStart(n, i); r.setEnd(n, i + text.length); const m = document.createElement('mark'); m.className = 'clip'; m.dataset.id = id; r.surroundContents(m); return true; }
  return false;
}
function applyClips(pid) { const b = $('#rBody'); if (!b) return; clips.filter(c => c.post === pid).forEach(c => { if (!b.querySelector(`mark[data-id="${c.id}"]`)) wrap(b, c.text, c.id); }); }
let sel = null, delId = null;
const pop = $('#pop');
function showPop(rect, mode) { $('#popClip').hidden = mode === 'del'; $('#popCopy').hidden = mode === 'del'; $('#popDel').hidden = mode !== 'del'; pop.hidden = false; const w = pop.offsetWidth, h = pop.offsetHeight; pop.style.left = Math.max(8, Math.min(innerWidth - w - 8, rect.left + rect.width / 2 - w / 2)) + 'px'; pop.style.top = (rect.top - h - 10 < 60 ? rect.bottom + 10 : rect.top - h - 10) + 'px'; }
function checkSel() {
  const s = getSelection(), b = $('#rBody');
  if (!b || $('#reader').hidden || !s || s.isCollapsed || !s.rangeCount) { if (!delId) pop.hidden = true; return; }
  const r = s.getRangeAt(0), t = s.toString().trim();
  if (!t || !b.contains(r.commonAncestorContainer)) { pop.hidden = true; return; }
  delId = null; sel = { text: t, single: r.startContainer === r.endContainer }; showPop(r.getBoundingClientRect(), 'add');
}
document.addEventListener('mouseup', e => { if (!pop.contains(e.target)) setTimeout(checkSel, 10); });
document.addEventListener('touchend', e => { if (!pop.contains(e.target)) setTimeout(checkSel, 250); });
$('#popClip').addEventListener('click', () => {
  if (!sel) return;
  if (!sel.single) { toast('請在同一段文字裡劃線'); pop.hidden = true; return; }
  const id = 'c' + Date.now().toString(36), p = posts.find(x => x.id === curId);
  getSelection().removeAllRanges();
  if (!wrap($('#rBody'), sel.text, id)) { toast('這段無法劃線'); pop.hidden = true; return; }
  clips.push({ id, post: curId, title: p ? p.title : curId, text: sel.text, t: Date.now() }); saveClips(); pop.hidden = true; toast('已存入書摘');
});
$('#popCopy').addEventListener('click', () => { if (sel) copyText(sel.text, '已複製'); getSelection().removeAllRanges(); pop.hidden = true; });
document.addEventListener('click', e => { const m = e.target.closest('#rBody mark.clip'); if (!m || !getSelection().isCollapsed) return; delId = m.dataset.id; showPop(m.getBoundingClientRect(), 'del'); });
$('#popDel').addEventListener('click', () => { const m = document.querySelector(`mark.clip[data-id="${delId}"]`); if (m) { m.replaceWith(...m.childNodes); } clips = clips.filter(c => c.id !== delId); saveClips(); delId = null; pop.hidden = true; toast('已刪除劃線'); });
document.addEventListener('pointerdown', e => { if (!pop.contains(e.target) && !e.target.closest('mark.clip')) delId = null; });
function drawer(open) {
  $('#drawer').hidden = !open; $('#dim').hidden = !open;
  if (!open) return;
  $('#clipSub').textContent = clips.length + ' 則 · 只存在這個瀏覽器';
  $('#clipList').innerHTML = clips.length ? clips.slice().reverse().map(c => `<li><div class="m"><span>${esc(c.title)} · ${new Date(c.t).toISOString().slice(0, 10)}</span><span><a href="#${esc(c.post)}" data-go>前往</a> · <button type="button" data-del="${c.id}">刪除</button></span></div><q>${esc(c.text)}</q></li>`).join('') : '<li class="none">還沒有書摘。打開一篇文章，選取一段文字，點「劃線摘錄」。</li>';
  $('#closeDrawer').focus();
}
$('#clipBtn').addEventListener('click', () => drawer(true));
$('#closeDrawer').addEventListener('click', () => drawer(false));
$('#dim').addEventListener('click', () => drawer(false));
$('#clipList').addEventListener('click', e => { if (e.target.closest('[data-go]')) drawer(false); const d = e.target.closest('[data-del]'); if (d) { const m = document.querySelector(`mark.clip[data-id="${d.dataset.del}"]`); if (m) m.replaceWith(...m.childNodes); clips = clips.filter(c => c.id !== d.dataset.del); saveClips(); drawer(true); } });
$('#copyAll').addEventListener('click', () => { if (!clips.length) return toast('還沒有書摘'); copyText(clips.map(c => `${c.title} (ΔιάΝους)\n- 標註 | ${new Date(c.t).toLocaleString()}\n\n${c.text}\n==========`).join('\n'), '已複製全部書摘'); });
addEventListener('keydown', e => { if (e.key === 'Escape') { if (!$('#drawer').hidden) drawer(false); pop.hidden = true; $('#zoom').hidden = true; } });
route();

/* live list: the same feed Blog B's own home page uses */
const excerptOf = html => {
  const doc = new DOMParser().parseFromString(html, 'text/html'), b = doc.getElementById('postBody'); if (!b) return { excerpt: '', chars: 0, need: false };
  b.querySelectorAll('script, style').forEach(n => n.remove());
  const t = b.textContent.replace(/\s+/g, ' ').trim().split('转载请注明出处')[0].trim();
  const chars = t.replace(/\s/g, '').length;
  return { excerpt: /[\w.+-]+@[\w-]+\.\w+/.test(t) || t.startsWith('{') ? '' : t.slice(0, 110), chars, need: false };
};
(async () => {
  for (const src of SOURCES) {
    try {
      const r = await fetch(src, { cache: 'no-cache' }); if (!r.ok) continue;
      const json = await r.json(), base = src.startsWith('http') && !src.includes('raw.githubusercontent') ? new URL('.', src).href : SITE;
      const known = Object.fromEntries(SNAP.map(p => [p.id, p]));
      const fresh = Object.keys(json).filter(k => /^P\d+$/.test(k)).map(k => {
        const v = json[k], old = known[k];
        return { id: k, title: String(v.postTitle || ''), date: String(v.createdDate || ''), labels: (v.labels || []).map(l => String(l.name || l)), url: new URL(String(v.postUrl || ''), base).href, excerpt: old ? old.excerpt : '', chars: old ? old.chars : 0, need: !old };
      }).sort((a, b) => (b.date.localeCompare(a.date)) || (+b.id.slice(1) - +a.id.slice(1)));
      if (!fresh.length) continue;
      all = fresh; posts = visible(all); render(); if (!$('#nf').hidden) route(); if (!$('#reader').hidden) { const p = posts.find(x => x.id === curId); if (p) openReader(p); } $('#fresh').textContent = posts.length + ' 篇';
      for (const p of fresh.filter(p => p.need).slice(0, 12)) { try { const h = await (await fetch(p.url)).text(); Object.assign(p, excerptOf(h)); posts = visible(all); render(); } catch (e) {} }
      return;
    } catch (e) {}
  }
})();
})();
