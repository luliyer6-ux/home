<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f7f8f5">
  <meta name="description" content="从2026年10月14日开始的考研行动仪表盘：68天计划、四科目标、每日任务与复盘。">
  <title>你一定能考上 · 考研行动仪表盘</title>
  <link rel="stylesheet" href="./dashboard.css?v=1">
  <link rel="stylesheet" href="./dashboard-extra.css?v=1">
  <link rel="stylesheet" href="./dashboard-redesign.css?v=2">
</head>
<body>
  <header class="topbar">
    <button class="mobile-menu icon-button" id="mobileMenu" aria-label="打开导航" aria-expanded="false">☰</button>
    <a class="brand" href="../../#/projects" aria-label="返回作品页"><span class="brand-mark">L</span><span><strong>考研行动</strong><small>STUDY DASHBOARD</small></span></a>
    <div class="top-date"><span id="todayLabel">2026年10月13日</span><strong id="countdown">距离考试还有 67 天</strong></div>
    <div class="top-actions"><span class="sync-status" id="syncStatus" role="status">公开计划</span><button class="quiet-button" id="loginButton">管理员登录</button><button class="icon-button theme-toggle" id="themeToggle" aria-label="切换深色模式">◐</button></div>
  </header>

  <div class="app-shell">
    <aside class="sidebar" id="sidebar" aria-label="仪表盘导航">
      <div class="sidebar-caption">学习工作台</div>
      <nav class="main-nav" id="mainNav" role="tablist" aria-label="仪表盘页面">
        <button class="nav-item active" id="tab-overview" role="tab" aria-selected="true" data-view="overview"><span>◫</span>概览</button>
        <button class="nav-item" id="tab-daily" role="tab" aria-selected="false" data-view="daily"><span>▦</span>每日行动</button>
        <button class="nav-item" id="tab-knowledge" role="tab" aria-selected="false" data-view="knowledge"><span>⌘</span>知识点</button>
        <button class="nav-item" id="tab-mocks" role="tab" aria-selected="false" data-view="mocks"><span>◷</span>模考追踪</button>
        <button class="nav-item" id="tab-reviews" role="tab" aria-selected="false" data-view="reviews"><span>↻</span>复盘记录</button>
      </nav>
      <div class="sidebar-bottom"><span class="dot"></span><span>计划起点</span><strong>2026.10.14</strong><p>目标总分 315 / 500<br>计划不顺延，周周可调整</p></div>
    </aside>
    <button class="backdrop" id="sidebarBackdrop" aria-label="关闭导航" hidden></button>

    <main class="main-content" id="mainContent">
      <div class="mobile-tabs" id="mobileTabs" aria-label="仪表盘页面"></div>
      <section class="view-panel" id="view-overview" role="tabpanel" aria-labelledby="tab-overview"></section>
      <section class="view-panel" id="view-daily" role="tabpanel" aria-labelledby="tab-daily" hidden></section>
      <section class="view-panel" id="view-knowledge" role="tabpanel" aria-labelledby="tab-knowledge" hidden></section>
      <section class="view-panel" id="view-mocks" role="tabpanel" aria-labelledby="tab-mocks" hidden></section>
      <section class="view-panel" id="view-reviews" role="tabpanel" aria-labelledby="tab-reviews" hidden></section>
      <footer class="page-footer"><span>你一定能考上</span><span>计划是指南，按诊断和每周复盘校准</span><a href="../../#/projects">返回作品区 ↗</a></footer>
    </main>
  </div>

  <dialog class="form-dialog" id="scoreDialog">
    <form method="dialog" id="scoreForm"><header><strong>记录一次模考</strong><button class="icon-button" value="cancel" aria-label="关闭">×</button></header>
      <label>记录类型<select name="kind"><option>首日诊断</option><option>分科限时测</option><option>阶段模考</option><option>整套模拟</option></select></label>
      <label>考试日期<input type="date" name="date" required></label>
      <div class="score-inputs">
        <label>政治（/100）<input type="number" name="politics" min="0" max="100" step="0.5" required></label>
        <label>英语二（/100）<input type="number" name="english2" min="0" max="100" step="0.5" required></label>
        <label>数学二（/150）<input type="number" name="math2" min="0" max="150" step="0.5" required></label>
        <label>408（/150）<input type="number" name="408" min="0" max="150" step="0.5" required></label>
      </div>
      <label>复盘备注<textarea name="note" rows="3" maxlength="1200" placeholder="时间分配、失分原因、下一步调整"></textarea></label>
      <footer><button value="cancel">取消</button><button class="primary-button" id="saveScore" value="save">保存记录</button></footer>
    </form>
  </dialog>
  <dialog class="form-dialog" id="reviewDialog">
    <form method="dialog" id="reviewForm"><header><strong>本周复盘</strong><button class="icon-button" value="cancel" aria-label="关闭">×</button></header>
      <label>复盘日期<input type="date" name="date" required></label>
      <label>本周完成得好的事<textarea name="wins" rows="2" maxlength="1000"></textarea></label>
      <label>最需要解决的三个问题<textarea name="gaps" rows="3" maxlength="1500"></textarea></label>
      <label>下周优先项<textarea name="next" rows="2" maxlength="1000"></textarea></label>
      <footer><button value="cancel">取消</button><button class="primary-button" value="save">保存复盘</button></footer>
    </form>
  </dialog>
  <script src="./plan-data.js?v=1" defer></script>
  <script src="./dashboard.js?v=1" defer></script>
</body>
</html>
