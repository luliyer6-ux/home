<!doctype html><html><head><meta charset="utf-8"><title>考研英语二词汇全覆盖阅读文集</title></head><body><p style="font-family:sans-serif;padding:2em">正在加载…</p><script>
(async()=>{try{const ps=[];for(let i=0;i<5;i++){const r=await fetch('gpt-english-2.part'+(i+1)+'.b64');if(!r.ok)throw new Error('part '+(i+1));ps.push(await r.text());}const bin=Uint8Array.from(atob(ps.join('').replace(/\s/g,'')),c=>c.charCodeAt(0));const text=await new Response(new Blob([bin]).stream().pipeThrough(new DecompressionStream('gzip'))).text();document.open();document.write(text);document.close();}catch(e){document.body.innerHTML='<p style="font-family:sans-serif;padding:2em">加载失败，请刷新重试。</p>';}})();
</script></body></html>
