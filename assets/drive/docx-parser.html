<!doctype html><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; img-src blob: data:; style-src 'unsafe-inline'; connect-src 'none'; font-src blob: data:">
<script src="jszip.min.js"></script><script src="docx-preview.min.js"></script>
<script>
function bounded(file){return new Promise((resolve,reject)=>{let size=0;const stream=file.internalStream('uint8array');stream.on('data',part=>{size+=part.length;if(size>16*1024*1024){stream.pause();reject(Error('Document part exceeds preview limits'));}});stream.on('error',reject);stream.on('end',()=>resolve(size));stream.resume();});}
addEventListener('message',async e=>{if(e.source!==parent||!e.data?.buffer)return;try{const data=e.data.buffer;if(data.byteLength>20*1024*1024)throw Error('File exceeds 20MB');const zip=await JSZip.loadAsync(data),files=Object.values(zip.files);if(files.length>2000)throw Error('Too many archive entries');let total=0;for(const f of files){const size=f._data?.uncompressedSize||0;total+=size;if(size>16*1024*1024||total>50*1024*1024)throw Error('Document expands beyond preview limits');}let actual=0;for(const file of files){if(file.dir)continue;actual+=await bounded(file);if(actual>50*1024*1024)throw Error('Document expands beyond preview limits');}const content=document.createElement('div'),styles=document.createElement('div');document.body.append(content,styles);await docx.renderAsync(data,content,styles,{inWrapper:false,ignoreFonts:true,breakPages:true,renderAltChunks:false,useBase64URL:true,renderHeaders:true,renderFooters:true});parent.postMessage({nonce:e.data.nonce,html:content.innerHTML,css:styles.textContent},'*');}catch(err){parent.postMessage({nonce:e.data.nonce,error:err.message},'*');}});
parent.postMessage({ready:true},'*');
</script>
