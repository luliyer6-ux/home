name: Build lists

# Keeps the song list and work list in sync with data/songs.json and
# data/works.json (see .github/scripts/build_lists.py). Uploading a file
# to works/ or music/, or pushing an R2/direct link into the data files,
# is enough: this workflow regenerates the site data and commits it back.

on:
  push:
    branches: [main]
    paths:
      - "data/**"
      - "works/**"
      - "music/**"
      - ".github/scripts/build_lists.py"
      - ".github/workflows/build-lists.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-lists
  cancel-in-progress: false

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ffmpeg (duration probing)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Rebuild lists from data files
        run: python3 .github/scripts/build_lists.py
      - name: Commit regenerated files
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "chore: rebuild song/work lists from data"
            git push
          else
            echo "No changes."
          fi
