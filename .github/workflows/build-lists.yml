name: Build lists

# Keeps the song, work and photo-wall lists in sync with data/*.json
# (see .github/scripts/build_lists.py). Uploading a file to works/,
# music/ or photos/, or pushing an R2/direct link into the data files,
# is enough: this workflow regenerates the site data and commits it back.

on:
  push:
    branches: [main]
    paths:
      - "data/**"
      - "works/**"
      - "music/**"
      - "photos/**"
      - ".github/scripts/build_lists.py"
      - ".github/workflows/build-lists.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-lists
  cancel-in-progress: false

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ffmpeg (duration probing)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Rebuild lists from data files
        run: python3 .github/scripts/build_lists.py
      - name: Check the regenerated site
        run: python3 .github/scripts/check_site.py
      - name: Commit regenerated files
        # Only the files build_lists.py writes are committed (anything else it might leave behind is not).
        # The public-articles workflow also pushes to main, so rebase onto it and retry instead of failing.
        run: |
          git add -A data index.html assets/site
          if git diff --cached --quiet; then echo "No changes."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: rebuild song/work lists from data"
          for attempt in 1 2 3 4; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            echo "push failed (attempt $attempt), retrying"; sleep $((attempt * 10))
          done
          exit 1
