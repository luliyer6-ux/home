name: Update public articles
on:
  schedule:
    - cron: '17 22 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: public-articles
  cancel-in-progress: false
jobs:
  publish:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Generate complete public snapshots
        run: python3 site-publish/generate.py
      - name: Commit only changed public snapshots
        run: |
          git add articles feed.xml sitemap.xml robots.txt public-articles.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'Luliy Publisher'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'Update public article snapshots and RSS'
          git pull --rebase origin main
          git push origin HEAD:main
